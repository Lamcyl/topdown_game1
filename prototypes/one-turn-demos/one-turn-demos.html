<style>
  /* Layout: one phone-width column — tabs, loop track, objective, message, board, satchel, actions. Single dark candlelit look, shared with the grid demos. */

    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
  body { font: 15px/1.45 var(--body); }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
  h1 { font: 700 20px/1.2 var(--display); letter-spacing: 0.04em; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .tab { font: 600 11px/1.2 var(--display); letter-spacing: 0.02em; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 2px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
  .game { display: flex; flex-direction: column; gap: 10px; }
  .game h2 { font: 700 17px/1.2 var(--display); margin: 0; letter-spacing: 0.03em; }
  .tagline { margin: 0; color: var(--muted); font-size: 13px; }
  .track { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font: 600 12px var(--body); padding: 4px 9px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); }
  .step.now { border: 1px solid var(--gold); color: var(--gold); }
  .step.done { border: 1px solid var(--good); color: var(--good); }
  .objective { font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }

  .stats { display: flex; flex-wrap: wrap; gap: 6px; }

  .stat b { font-weight: 600; }
  .stat.good b { color: var(--good); } .stat.bad b { color: var(--bad); } .stat.gold b { color: var(--gold); }
  .msg { margin: 0; min-height: 2.9em; padding: 8px 10px; background: var(--panel); border-left: 3px solid var(--gold); border-radius: 4px; font-size: 14px; }
  .result { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .result.win { border-color: var(--good); } .result.lose { border-color: var(--bad); }
  .result strong { font: 700 16px var(--display); }
  .board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; width: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 5px; padding: 0; cursor: pointer; background: var(--cell); color: var(--fg); font-size: clamp(16px, 5.6vw, 28px); line-height: 1; display: grid; place-items: center; }
  .cell:nth-child(odd) { background: var(--cell-alt); }
  .cell:focus-visible, .tab:focus-visible, .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .cell .badge { position: absolute; right: 2px; bottom: 1px; font: 600 10px/1 var(--body); color: var(--fg); background: rgba(0,0,0,.6); border-radius: 4px; padding: 1px 3px; }
  .cell .badge.l { left: 2px; right: auto; } .cell .badge.top { top: 1px; bottom: auto; }
  .cell .badge.bad { color: #fff; background: var(--bad); } .cell .badge.good { color: #10140f; background: var(--good); } .cell .badge.gold { color: #1a1408; background: var(--gold); }
  .cell.target { box-shadow: inset 0 0 0 2px var(--gold); }
  .cell.attack { box-shadow: inset 0 0 0 3px var(--bad); }
  .cell.flash { animation: flash .5s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px #fff, 0 0 18px var(--gold); } to { box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .cell.flash { animation: none; } }
  .ally { text-shadow: 0 0 6px var(--good); } .enemy { text-shadow: 0 0 6px var(--bad); }
  .t-wall { background: #0d0c12 !important; } .t-water { background: #1d3f63 !important; }
  .sp-hay { background: #5e5226 !important; } .sp-oil { background: #3b2a12 !important; } .sp-ash { background: #2a2424 !important; }
  .sp-frozen { box-shadow: inset 0 0 0 2px #9fd8f0; } .sp-fire { background: #a2401c !important; }
  .am-road { background: #4a3c28 !important; } .am-grass { background: #263826 !important; }
  .road-arrow { font-size: 55%; opacity: .5; }
  .vg-home { background: #23302a !important; } .vg-foe { background: #33222a !important; }
  .du-zone { background: #2b2a3f !important; } .du-intent { box-shadow: inset 0 0 0 1px rgba(224,98,122,.55); }
  .du-fire { background: #a2401c !important; } .du-frost { background: #4f8fb0 !important; } .du-lightning { background: #b49a2a !important; } .du-arcane { background: #7a4fb0 !important; }
  .mirror { font-size: 120%; color: #cde6ff; }
  .he-route { background: #3a3324 !important; } .he-seen { box-shadow: inset 0 0 0 999px rgba(224,98,122,.28); } .he-smoke { box-shadow: inset 0 0 0 999px rgba(200,200,210,.45); }
  .satchel { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .satchel h3 { grid-column: 1 / -1; margin: 2px 0 0; font: 600 12px var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); cursor: pointer; font-size: 11px; min-width: 0; }
  .item .ic { font-size: 22px; line-height: 1.1; } .item .nm { text-align: center; overflow-wrap: anywhere; }
  .item .ct { position: absolute; top: 3px; right: 5px; font: 600 11px var(--body); color: var(--gold); } .item .anc { position: absolute; top: 3px; left: 5px; font-size: 11px; }
  .item[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); background: #2c2636; }
  .item:disabled { opacity: .4; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { font: 600 14px var(--body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); }
  .btn:disabled { opacity: .45; cursor: default; }
  details.help { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details.help summary { cursor: pointer; font-weight: 600; }
  details.help ul { margin: 8px 0 4px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 65ch; }
</style>

<div class="wrap">
  <header>
    <h1>One-Turn Fight Demos</h1>
    <p class="sub">Each game is a loop of fights 4–6. Set up, press Unleash, and watch it play out with no further input. Win and you keep one thing you found. Lose and the loop resets to fight 4 with your original satchel. Items are used up; ⚓ items were carried over from an earlier loop.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Demos">
    <button class="tab" role="tab" id="tab-spark" data-game="spark">Spark</button>

  <section class="game" id="game-ambush" role="tabpanel" aria-labelledby="tab-ambush" hidden></section>
  <section class="game" id="game-vanguard" role="tabpanel" aria-labelledby="tab-vanguard" hidden></section>
  <section class="game" id="game-duel" role="tabpanel" aria-labelledby="tab-duel" hidden></section>
  <section class="game" id="game-heist" role="tabpanel" aria-labelledby="tab-heist" hidden></section>

<script>
// One-turn demo games: pure logic (no DOM), shared by the page and the solver script.
// Each game: items, starting satchel, encounters, setupState(enc, placements), canPlace(...), sim(...) -> { frames, win, reason }.
/* eslint-disable no-unused-vars */
const DIR4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const DIR8 = [...DIR4, [-1, -1], [-1, 1], [1, -1], [1, 1]];
const ARROW = { '↑': [-1, 0], '→': [0, 1], '↓': [1, 0], '←': [0, -1] };
const clone = (o) => JSON.parse(JSON.stringify(o));
const sgn = Math.sign;

// ======================================================================== SPARK
const SPARK_UNITS = {
  goblin: { icon: '👺', name: 'Goblin', hp: 1 },
  ogre: { icon: '👹', name: 'Ogre', hp: 3 },
  cultist: { icon: '🧟', name: 'Cultist', hp: 2 },
  chief: { icon: '🧌', name: 'Ogre Chieftain', hp: 5 },
  prisoner: { icon: '🧑', name: 'Prisoner', hp: 1, ally: true },
};
const SPARK_LEGEND = {
  '.': ['floor'], '"': ['hay'], '~': ['water'], '#': ['wall'], B: ['floor', 'barrel'], P: ['floor', 'pillar'], M: ['floor', 'metal'],
  g: ['floor', null, 'goblin'], h: ['hay', null, 'goblin'], O: ['floor', null, 'ogre'], c: ['floor', null, 'cultist'], w: ['water', null, 'cultist'],
  x: ['water', null, 'prisoner'], X: ['floor', null, 'prisoner'], K: ['floor', null, 'chief'],
};
const Spark = {
  key: 'spark', title: 'Spark', R: 6, C: 6, frameMs: 420,
  tagline: 'Set up the room, then light one spark. Everything that burns, falls or conducts goes off in a chain.',
  items: {
    spark: { name: 'Spark Stone', icon: '✴️', info: 'Lights its tile when you Unleash. Fire spreads to touching hay, oil and barrels.' },
    oil: { name: 'Oil Flask', icon: '🫗', info: 'Turns a tile into oil: it catches fire and burns harder (2 damage).' },
    gust: { name: 'Gust Charm', icon: '🌀', dirs: ['↑', '→', '↓', '←'], info: 'Blows in a direction when you Unleash. Topples the first pillar, rolls a barrel, or shoves a creature.' },
    rod: { name: 'Lightning Rod', icon: '⚡', info: 'Calls lightning. It runs through touching water and metal: 2 damage to anyone in the water or next to the metal, and it sets off barrels by the metal.' },
    frost: { name: 'Frost Shard', icon: '❄️', info: 'Freezes a tile, even one with a creature on it. Frozen things can’t burn, be hurt or conduct.' },
  },
  satchel: { spark: 2, gust: 2, rod: 1, oil: 2, frost: 1 },
  anchored: ['frost'],
  encounters: [
    { name: 'Goblin Camp', goal: 'Kill every goblin and the ogre.', reward: ['oil', 'rod', 'frost'],
      map: ['.h""..', '."B"h.', '.."..P', '.."..O', 'P.....', '......'] },
    { name: 'The Drowned Shrine', goal: 'Kill the three cultists. The prisoner must survive.', reward: ['spark', 'oil', 'gust'],
      map: ['......', '.w~~w.', '.~x~..', '.~~~MB', '....c.', '......'] },
    { name: 'Chieftain’s Hall', goal: 'Kill the Ogre Chieftain (5 HP) and his two guards.', reward: [],
      map: ['......', '..P...', '..KB.h', '..".""', 'h""...', '......'] },
  ],
  setupState(enc, placements) {
    const cells = enc.map.map((row) => [...row].map((ch) => {
      const [t, obj, u] = SPARK_LEGEND[ch];
      return { t, obj: obj || null, unit: u ? { type: u, hp: SPARK_UNITS[u].hp } : null, fire: false, burnt: false, frozen: false, item: null, fx: null };
    }));
    for (const p of placements) {
      const x = cells[p.r][p.c]; x.item = { k: p.k, dir: p.dir };
      if (p.k === 'oil') x.t = 'oil';
      if (p.k === 'frost') x.frozen = true;
    }
    return { cells };
  },
  canPlace(enc, placements, k, r, c) {
    const x = this.setupState(enc, placements).cells[r][c];
    if (x.item) return 'Something is already placed there.';
    if (x.t === 'wall') return 'Nothing can go on a wall.';
    if (k === 'frost') return true;
    if (x.unit || x.obj) return 'Place it on an empty tile.';
    if (x.t === 'water') return 'That can’t go in water.';
    return true;
  },
  describe(enc, placements, r, c) {
    const x = this.setupState(enc, placements).cells[r][c];
    if (x.unit) return `${SPARK_UNITS[x.unit.type].name}: ${x.unit.hp} HP.${SPARK_UNITS[x.unit.type].ally ? ' Keep them alive.' : ''}`;
    return { barrel: 'Barrel: explodes when lit, 2 damage to the 3×3 around it. Lights and topples things nearby.', pillar: 'Pillar: falls 2 tiles when toppled, crushing for 3.', metal: 'Iron chains: carry lightning to everything touching them.' }[x.obj]
      || { hay: 'Hay: burns (1 damage) and spreads fire.', water: 'Water: stops fire, carries lightning.', oil: 'Oil: burns for 2.' }[x.t] || 'Empty floor.';
  },
  sim(enc, placements) {
    const st = this.setupState(enc, placements), frames = [];
    let log = [], next = [], topples = [];
    const cell = (r, c) => (r >= 0 && r < 6 && c >= 0 && c < 6 ? st.cells[r][c] : null);
    const hurt = (x, n, why) => {
      if (!x || !x.unit || x.unit.hp <= 0) return;
      if (x.frozen) { x.fx = 'hit'; return; }
      x.unit.hp = Math.max(0, x.unit.hp - n); x.fx = 'hit';
      if (x.unit.hp <= 0) log.push(`${SPARK_UNITS[x.unit.type].name} ${why}.`);
    };
    const flammable = (x) => x && !x.frozen && !x.fire && !x.burnt && (x.obj === 'barrel' || x.t === 'hay' || x.t === 'oil');
    const snap = () => { frames.push({ st: clone(st), log: log.join(' ') }); log = []; for (const row of st.cells) for (const x of row) x.fx = null; };
    const topple = (r, c, dr, dc, later) => {
      const x = cell(r, c); if (!x || x.obj !== 'pillar') return;
      x.obj = 'rubble'; log.push('A pillar topples!');
      for (let k = 1; k <= 2; k++) {
        const y = cell(r + dr * k, c + dc * k); if (!y || y.t === 'wall') break;
        y.fx = 'crush'; hurt(y, 3, 'is crushed');
        if (y.obj === 'barrel' && !y.frozen) next.push([r + dr * k, c + dc * k]);
        if (y.obj === 'pillar') { later.push([r + dr * k, c + dc * k, dr, dc]); break; }
      }
    };
    const ignite = (r, c, fromSpark) => {
      const x = cell(r, c); if (!x || x.frozen) return;
      if (x.obj === 'barrel') {
        x.obj = null; log.push('A barrel explodes!');
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const y = cell(r + dr, c + dc); if (!y) continue;
          y.fx = 'boom'; hurt(y, 2, 'is caught in the blast');
          if (dr || dc) { if (flammable(y)) next.push([r + dr, c + dc]); if (y.obj === 'pillar' && !y.frozen) topples.push([r + dr, c + dc, dr, dc]); }
        }
        return;
      }
      if (x.fire || x.burnt) return;
      if (x.t === 'hay' || x.t === 'oil') { x.fire = true; hurt(x, x.t === 'oil' ? 2 : 1, 'burns'); }
      else if (fromSpark) x.fire = true;
      else return;
      for (const [dr, dc] of DIR4) if (flammable(cell(r + dr, c + dc))) next.push([r + dr, c + dc]);
    };
    snap();
    // t0: gusts, then lightning, then sparks
    const now = [];
    for (const p of placements.filter((p) => p.k === 'gust')) {
      const [dr, dc] = ARROW[p.dir]; st.cells[p.r][p.c].item = null; log.push('The gust blows!');
      for (let k = 1; k <= 4; k++) {
        const r = p.r + dr * k, c = p.c + dc * k, y = cell(r, c);
        if (!y || y.t === 'wall' || y.obj === 'metal') break;
        if (y.obj === 'pillar') { if (!y.frozen) topple(r, c, dr, dc, topples); break; }
        if (y.obj === 'barrel') {
          let cr = r, cc = c;
          for (;;) { const z = cell(cr + dr, cc + dc); if (!z || z.t === 'wall' || z.obj || (z.unit && z.unit.hp > 0) || z.t === 'water') break; z.obj = 'barrel'; cell(cr, cc).obj = null; cr += dr; cc += dc; }
          if (cr !== r || cc !== c) log.push('A barrel rolls.');
          break;
        }
        if (y.unit && y.unit.hp > 0) {
          if (y.frozen) break;
          const z = cell(r + dr, c + dc);
          if (!z || z.t === 'wall' || z.obj || (z.unit && z.unit.hp > 0)) { hurt(y, 1, 'is slammed into something'); if (z && z.unit) hurt(z, 1, 'is slammed'); }
          else { z.unit = y.unit; y.unit = null; z.fx = 'hit'; log.push(`${SPARK_UNITS[z.unit.type].name} is shoved.`); }
          break;
        }
      }
    }
    for (const p of placements.filter((p) => p.k === 'rod')) {
      st.cells[p.r][p.c].item = null;
      const key = (r, c) => r * 6 + c, seen = new Set([key(p.r, p.c)]), q = [[p.r, p.c]], hit = [];
      while (q.length) {
        const [r, c] = q.pop();
        for (const [dr, dc] of DIR4) {
          const y = cell(r + dr, c + dc);
          if (!y || seen.has(key(r + dr, c + dc))) continue;
          if ((y.t === 'water' && !y.frozen) || y.obj === 'metal') { seen.add(key(r + dr, c + dc)); q.push([r + dr, c + dc]); hit.push([r + dr, c + dc]); }
        }
      }
      log.push(hit.length ? 'Lightning strikes the rod and races through the water and iron!' : 'Lightning strikes the rod, but nothing carries it.');
      for (const [r, c] of hit) {
        const y = cell(r, c); y.fx = 'zap';
        if (y.t === 'water') hurt(y, 2, 'is electrocuted');
        if (y.obj === 'metal') for (const [dr, dc] of DIR4) { const z = cell(r + dr, c + dc); if (!z) continue; hurt(z, 2, 'is shocked'); if (z.obj === 'barrel' && !z.frozen) next.push([r + dr, c + dc]); }
      }
    }
    for (const p of placements.filter((p) => p.k === 'spark')) now.push([p.r, p.c]);
    for (const [r, c] of now) { st.cells[r][c].item = null; ignite(r, c, true); }
    for (const t of topples.splice(0)) topple(...t, topples);
    if (now.length) log.unshift('Spark!');
    snap();
    for (let step = 0; step < 40 && (next.length || topples.length); step++) {
      for (const row of st.cells) for (const x of row) if (x.fire) { x.fire = false; x.burnt = true; if (x.t === 'hay' || x.t === 'oil') x.t = 'ash'; }
      const cur = next, tp = topples; next = []; topples = [];
      for (const [r, c] of cur) ignite(r, c, false);
      const later = [];
      for (const t of tp) topple(...t, later);
      topples.push(...later);
      snap();
    }
    for (const row of st.cells) for (const x of row) if (x.fire) { x.fire = false; x.burnt = true; if (x.t === 'hay' || x.t === 'oil') x.t = 'ash'; }
    frames.push({ st: clone(st), log: 'The smoke clears.' });
    const units = st.cells.flat().filter((x) => x.unit).map((x) => x.unit);
    const foes = units.filter((u) => !SPARK_UNITS[u.type].ally && u.hp > 0);
    const allyDead = units.some((u) => SPARK_UNITS[u.type].ally && u.hp <= 0);
    const win = !foes.length && !allyDead;
    const reason = allyDead ? 'The prisoner died.' : foes.length ? `${foes.length} enem${foes.length > 1 ? 'ies' : 'y'} survived: ${foes.map((u) => SPARK_UNITS[u.type].name).join(', ')}.` : 'Every enemy is down.';
    return { frames, win, reason };
  },
};

// ======================================================================== AMBUSH
const AMBUSH_UNITS = {
  goblin: { icon: '👺', name: 'Goblin', hp: 2, spd: 1 },
  orc: { icon: '👹', name: 'Orc', hp: 3, spd: 1 },
  wolf: { icon: '🐺', name: 'Wolf', hp: 2, spd: 2 },
  troll: { icon: '🧌', name: 'Troll', hp: 4, spd: 1, smash: true },
  shaman: { icon: '🧙‍♂️', name: 'Shaman', hp: 2, spd: 1, heal: true },
};
const Ambush = {
  key: 'ambush', title: 'Ambush', R: 8, C: 6, frameMs: 380,
  tagline: 'A war party marches on the village along the marked road. Lay your traps, then let them march.',
  items: {
    bear: { name: 'Bear Trap', icon: '🪤', info: 'On the road. Holds the first enemy for 3 steps (a troll for 1). Everyone behind it has to wait.' },
    glyph: { name: 'Fire Glyph', icon: '🔥', info: 'On the road. Bursts when stepped on: 2 damage to that tile and the 4 touching it. One use.' },
    spikes: { name: 'Spikes', icon: '🗡️', info: 'On the road. 1 damage to every enemy that steps on it.' },
    totem: { name: 'Arrow Totem', icon: '🏹', info: 'Beside the road. Every other step it shoots the most advanced enemy on the 8 tiles around it for 1.' },
    wall: { name: 'Thorn Wall', icon: '🌵', info: 'On the road. Blocks it until smashed (2 hits; a troll breaks it at once).' },
  },
  satchel: { bear: 2, glyph: 2, spikes: 2, totem: 2, wall: 1 },
  anchored: ['wall'],
  encounters: [
    { name: 'Goblin Raiders', goal: 'Stop the orc and three goblins before they reach the village 🏠.', reward: ['glyph', 'totem', 'spikes'],

  pathIndex(enc, r, c) { return enc.path.findIndex(([pr, pc]) => pr === r && pc === c); },
  setupState(enc, placements) {

    for (let tick = 0; tick < 80 && !lost; tick++) {
      st.tick = tick;
      for (const f of st.foes) {
        if (f.hp <= 0 || tick < f.start || lost) continue;
        if (f.held > 0) { f.held--; continue; }
        for (let s = 0; s < AMBUSH_UNITS[f.type].spd; s++) {
          const ni = f.idx + 1, x = cellOf(ni);

          if (x.item && x.item.k === 'wall' && !x.item.spent) {
            x.fx = 'hit';

            else if (--x.item.hp <= 0) { x.item.spent = true; log.push('The thorn wall is torn down.'); }
            break;
          }
          f.idx = ni;
          if (ni === last) { lost = `${AMBUSH_UNITS[f.type].name} reached the village.`; break; }
          const it = x.item;
          if (it && !it.spent) {
            if (it.k === 'bear') { it.spent = true; f.held = AMBUSH_UNITS[f.type].smash ? 1 : 3; x.fx = 'hit'; log.push(`The bear trap snaps shut on the ${AMBUSH_UNITS[f.type].name}!`); break; }
            if (it.k === 'glyph') {

            if (it.k === 'spikes') hurt(f, 1, 'is impaled');

      }
      if (lost) { log.push(lost); snap(); break; }

        if (!x.item || x.item.k !== 'totem' || tick % 2 === 1) return;
        const inRange = st.foes.filter((f) => f.hp > 0 && f.idx >= 0 && Math.max(Math.abs(P[f.idx][0] - r), Math.abs(P[f.idx][1] - c)) <= 1);
        if (inRange.length) { inRange.sort((a, b) => b.idx - a.idx); hurt(inRange[0], 1, 'is shot down'); }

      for (const s of st.foes.filter((f) => f.hp > 0 && f.idx >= 0 && AMBUSH_UNITS[f.type].heal)) {
        for (const g of st.foes) if (g !== s && g.hp > 0 && g.idx >= 0 && g.hp < AMBUSH_UNITS[g.type].hp && Math.max(Math.abs(P[g.idx][0] - P[s.idx][0]), Math.abs(P[g.idx][1] - P[s.idx][1])) <= 1) g.hp++;
      }
      snap();
      if (st.foes.every((f) => f.hp <= 0)) break;
    }
    const alive = st.foes.filter((f) => f.hp > 0);
    const win = !lost && !alive.length;
    return { frames, win, reason: lost || (alive.length ? 'The war party is still coming.' : 'The war party is broken.') };
  },
};

    const name = (u) => (u.type === 'you' ? 'You' : DUEL_FOES[u.type].name);
    const dmg = (u, n, el) => {
      const d = DUEL_FOES[u.type] || {};
      const m = d.immune === el ? 0 : d.weak === el ? 2 : 1;
      u.hp = Math.max(0, u.hp - n * m); st.fx.push([u.r, u.c]);
      log.push(m === 0 ? `${name(u)} shrugs off the ${el}.` : `${name(u)} take${u.type === 'you' ? '' : 's'} ${n * m}${m === 2 ? ' (weak!)' : ''}.`);
    };
    snap();
    const queue = st.beams.map((b) => ({ r: b.r, c: b.c, dir: b.dir, el: b.el, pow: b.pow, n: b.n }));
    let guard = 0;
    while (queue.length && guard++ < 30) {
      const b = queue.shift(); st.trail = [];
      log.push(`Beam ${b.n}: ${b.el} ${b.pow} ${EL[b.el]}`);
      let r = b.r, c = b.c, dir = b.dir;
      for (let step = 0; step < 60; step++) {
        const [dr, dc] = ARROW[dir]; r += dr; c += dc;
        if (r < 0 || r >= 7 || c < 0 || c >= 6) break;
        st.trail.push([r, c, b.el]);
        if (st.walls.some(([wr, wc]) => wr === r && wc === c)) { log.push('It hits stone.'); snap(); break; }
        const u = unitAt(r, c);
        if (u) { dmg(u, b.pow, b.el); snap(); break; }
        const it = st.items.find((x) => x.r === r && x.c === c);
        if (it) {
          if (it.ice) { log.push('It shatters on the ice wall.'); snap(); break; }
          if (it.k === 'shield' && !it.used) { it.used = true; log.push('The shield stone absorbs it and crumbles.'); snap(); break; }
          if (it.k === 'mirror') { dir = MIRROR[it.dir][dir]; log.push('Reflected!'); }
          if (it.k === 'prism' && !it.used) {
            it.used = true; log.push('The prism splits it!');
            queue.unshift({ r, c, dir: REV[LEFT[dir]], el: b.el, pow: b.pow, n: b.n + 'b' });
            queue.unshift({ r, c, dir: LEFT[dir], el: b.el, pow: b.pow, n: b.n + 'a' });
            snap(); break;
          }
          if (it.k === 'leech' && !it.used) { it.used = true; dir = REV[dir]; b.pow += 1; log.push(`The leech rune hurls it back at ${b.pow}!`); }
          if (it.k === 'ward') {
            if (b.el === 'fire') { log.push('The water ward snuffs the fire.'); snap(); break; }
            if (b.el === 'frost') { it.ice = true; log.push('The ward freezes into an ice wall.'); snap(); break; }
            if (b.el === 'lightning') { log.push('The ward crackles!'); for (const [ddr, ddc] of DIR8) { const o = unitAt(r + ddr, c + ddc); if (o) dmg(o, 2, 'lightning'); } }
          }
        }
        snap();
      }
      st.trail = [];
      if (st.units.find((u) => u.type === 'you').hp <= 0) break;
    }
    snap();
    const you = st.units.find((u) => u.type === 'you');
    const boss = st.units[0];
    const win = you.hp > 0 && boss.hp <= 0;
    return { frames, win, persist: { hp: you.hp },
      reason: you.hp <= 0 ? 'The spell killed you.' : boss.hp > 0 ? `The ${DUEL_FOES[boss.type].name} survived with ${boss.hp} HP.` : `The ${DUEL_FOES[boss.type].name} falls. You keep ${you.hp} HP.` };
  },
};

      guards: [

  tile(enc, r, c) { return r >= 0 && r < 8 && c >= 0 && c < 6 ? enc.map[r][c] : '#'; },

  guardAt(enc, i, t) { const g = enc.guards[i]; return g.patrol[(g.start + t) % g.patrol.length]; },
  canPlace(enc, placements, k, r, c, route) {

  },
  passable(enc, placements, r, c) {

  describe(enc, placements, r, c) {

    if (gi >= 0) return enc.guards[gi].type === 'hound' ? 'Hound: smells you on its own tile and the 4 touching it. Smoke doesn’t stop it.' : 'Guard: walks the dotted route and sees 3 tiles ahead.';
    return { R: 'The relic. Your route must pass here.', E: 'The exit. Your route starts here and must end here.', D: 'Locked door. Needs a Skeleton Key on it.', '#': 'Wall.' }[ch] || 'Floor.';
  },
  // Runs the night. With detect=false it just plays guard movement (used for the planning preview).
  sim(enc, placements, persist, route, detect = true) {
    const frames = [], n = route.length;
    const guards = enc.guards.map((g, i) => {
      const [r, c] = this.guardAt(enc, i, 0);
      return { i, type: g.type, r, c, face: null, asleep: placements.some((p) => p.k === 'dart' && p.r === r && p.c === c), lure: null };
    });
    const decoy = placements.find((p) => p.k === 'decoy');
    const smoke = [];
    let invisUntil = -1, caught = null, log = [];
    const blocked = (r, c) => !this.passable(enc, placements, r, c);
    const smoky = (r, c, t) => smoke.some((s) => t >= s.t0 && t < s.t0 + 4 && Math.abs(s.r - r) <= 1 && Math.abs(s.c - c) <= 1);
    if (decoy) for (const g of guards) if (!g.asleep && Math.abs(g.r - decoy.r) + Math.abs(g.c - decoy.c) <= 4) { g.lure = [decoy.r, decoy.c]; log.push(`A ${g.type} turns toward the decoy.`); }
    const stepToward = (g, [tr, tc]) => {
      const key = (r, c) => r * 6 + c, prev = new Map([[key(g.r, g.c), null]]), q = [[g.r, g.c]];
      while (q.length) {
        const [r, c] = q.shift();
        if (Math.abs(r - tr) + Math.abs(c - tc) === 1) {
          let cur = [r, c]; while (prev.get(key(...cur)) && (prev.get(key(...cur))[0] !== g.r || prev.get(key(...cur))[1] !== g.c)) cur = prev.get(key(...cur));
          return cur[0] === g.r && cur[1] === g.c ? null : cur;
        }
        for (const [dr, dc] of DIR4) { const nr = r + dr, nc = c + dc; if (!blocked(nr, nc) && !prev.has(key(nr, nc)) && !(nr === tr && nc === tc)) { prev.set(key(nr, nc), [r, c]); q.push([nr, nc]); } }
      }
      return null;
    };
    const faceTo = (g, r, c) => { const dr = r - g.r, dc = c - g.c; if (dr || dc) g.face = Math.abs(dr) >= Math.abs(dc) ? (dr < 0 ? '↑' : '↓') : (dc < 0 ? '←' : '→'); };
    const vision = (g, t) => {
      if (g.asleep) return [];
      if (g.type === 'hound') return [[g.r, g.c], ...DIR4.map(([dr, dc]) => [g.r + dr, g.c + dc])];
      const out = [[g.r, g.c]];
      if (!g.face) return out;
      const [dr, dc] = ARROW[g.face];
      for (let k = 1; k <= 3; k++) { const r = g.r + dr * k, c = g.c + dc * k; if (this.tile(enc, r, c) === '#' || this.tile(enc, r, c) === 'D' || smoky(r, c, t)) break; out.push([r, c]); }
      return out;
    };
    // initial facing for patrols
    guards.forEach((g, i) => { if (!g.lure) { const [nr, nc] = this.guardAt(enc, i, 1); faceTo(g, nr, nc); } else faceTo(g, ...g.lure); });
    const snapshot = (t, thief) => frames.push({ st: { t, thief, guards: clone(guards), cones: guards.map((g) => vision(g, t)), smoke: smoke.filter((s) => t >= s.t0 && t < s.t0 + 4).map((s) => [s.r, s.c]), invis: t <= invisUntil, caught, steps: n - 1 }, log: log.join(' ') });
    snapshot(0, route[0]); log = [];
    const T = Math.max(n - 1, detect ? 0 : 20);
    for (let t = 1; t <= T && !caught; t++) {
      const prevThief = route[Math.min(t - 1, n - 1)], thief = route[Math.min(t, n - 1)];
      const before = guards.map((g) => [g.r, g.c]);
      guards.forEach((g, i) => {
        if (g.asleep) return;
        if (g.lure) { const s = stepToward(g, g.lure); if (s) { faceTo(g, ...s); [g.r, g.c] = s; } faceTo(g, ...g.lure); return; }
        const [nr, nc] = this.guardAt(enc, i, t); faceTo(g, nr, nc); g.r = nr; g.c = nc;
        const [ar, ac] = this.guardAt(enc, i, t + 1); faceTo(g, ar, ac);
      });
      if (t < n) {
        for (const p of placements) if (p.r === thief[0] && p.c === thief[1]) {
          if (p.k === 'smoke' && !smoke.some((s) => s.p === p)) { smoke.push({ r: p.r, c: p.c, t0: t, p }); log.push('Smoke!'); }
          if (p.k === 'invis' && invisUntil < 0) { invisUntil = t + 2; log.push('You fade into shadow.'); }
        }
      }
      if (detect && t < n) {
        guards.forEach((g, i) => {
          if (caught || g.asleep) return;
          const swapped = g.r === prevThief[0] && g.c === prevThief[1] && before[i][0] === thief[0] && before[i][1] === thief[1];
          const sees = vision(g, t).some(([r, c]) => r === thief[0] && c === thief[1]);

        });
      }
      snapshot(t, thief); log = [];
    }

    const gotRelic = route.some(([r, c]) => r === rr && c === rc);
    const end = route[n - 1];
    const out = end[0] === er && end[1] === ec;
    const win = !caught && gotRelic && out && n - 1 <= enc.maxSteps;
    return { frames, win, reason: caught || (!gotRelic ? 'You never took the relic.' : !out ? 'You never made it back out.' : n - 1 > enc.maxSteps ? 'Too slow: dawn broke.' : 'Clean getaway.') };
  },
};

const ONE_TURN_GAMES = { spark: Spark, ambush: Ambush, vanguard: Vanguard, duel: Duel, heist: Heist };

// One-turn demos: page shell. Runs a 3-fight loop per game on top of logic.js.
const $tab = (k) => document.getElementById('tab-' + k);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const stat = (label, value, tone = '') => el('span', { class: 'stat ' + tone }, label + ' ', el('b', {}, String(value)));
const btn = (label, onclick, opts = {}) => el('button', { class: 'btn' + (opts.primary ? ' primary' : ''), onclick, disabled: opts.disabled }, label);
const badge = (txt, cls = '') => `<span class="badge ${cls}">${txt}</span>`;
function boardEl(rows, cols, cellFn, onTap) {
  const b = el('div', { class: 'board', style: `--cols:${cols}` });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const s = cellFn(r, c);
    const cell = el('button', { class: 'cell ' + (s.cls || ''), 'aria-label': s.label || `row ${r + 1}, column ${c + 1}`, onclick: () => onTap(r, c) });
    cell.innerHTML = s.html || '';
    b.append(cell);
  }
  return b;
}

const RENDER = {
  spark(st, r, c) {

    if (x.frozen) cls += ' sp-frozen';
    if (x.fire) cls += ' sp-fire';
    if (x.fx) cls += ' flash';
    let html = { barrel: '🛢️', pillar: '🏛️', metal: '⛓️', rubble: '<span style="opacity:.5">🪨</span>' }[x.obj] || '';

      const u = SPARK_UNITS[x.unit.type];
      html = x.unit.hp > 0 ? `<span class="${u.ally ? 'ally' : 'enemy'}">${u.icon}</span>` + badge(x.unit.hp, u.ally ? 'good' : 'bad') : '<span style="opacity:.45">💀</span>';
    }
    if (x.item && Spark.items[x.item.k] && x.item.k !== 'oil' && x.item.k !== 'frost') html = Spark.items[x.item.k].icon + (x.item.dir ? badge(x.item.dir, 'gold') : '');
    if (x.fire && !x.unit && !x.obj) html = '🔥';
    if (x.frozen) html += badge('❄️', 'l top');

    return { cls, html };
  },
  ambush(st, r, c, L) {
    const enc = L.enc, x = st.cells[r][c], P = enc.path, last = P.length - 1;
    let cls = x.t === 'rock' ? 't-wall' : x.path >= 0 ? 'am-road' : 'am-grass', html = '';
    if (x.fx) cls += ' flash';
    if (x.path === last) html = '🏠';
    if (x.path >= 0 && x.path < last) {
      const [nr, nc] = P[x.path + 1];
      html = `<span class="road-arrow">${nr < r ? '↑' : nr > r ? '↓' : nc < c ? '←' : '→'}</span>`;
    }
    if (x.item && !(x.item.k === 'wall' && x.item.spent) && !(x.item.k === 'glyph' && x.item.spent)) html = `<span style="${x.item.spent ? 'opacity:.4' : ''}">${Ambush.items[x.item.k].icon}</span>`;

    if (f) html = `<span class="enemy">${AMBUSH_UNITS[f.type].icon}</span>` + badge(f.hp, 'bad') + (f.held ? badge('🪤', 'l') : '');
    if (x.path === 0) { const waiting = st.foes.filter((f) => f.hp > 0 && f.idx < 0).length; if (waiting) html += badge('+' + waiting, 'l top gold'); }

  },
  vanguard(st, r, c) {

    if (u) {
      html = `<span class="${u.side === 'ally' ? 'ally' : 'enemy'}">${VG_UNITS[u.type].icon}</span>` + badge(u.hp, u.side === 'ally' ? 'good' : 'bad');
      if (u.gear) html += badge(Vanguard.items[u.gear].icon, 'l top');
    }
    if (st.fx.some(([fr, fc]) => fr === r && fc === c)) cls += ' flash';
    return { cls, html };
  },
  duel(st, r, c, L) {
    let cls = r >= 2 && r <= 5 ? 'du-zone' : '', html = '';
    const tr = st.trail.find(([tr, tc]) => tr === r && tc === c);
    if (tr) cls += ' du-' + tr[2];
    else if (L.phase === 'setup' && L.intent && L.intent.has(r * 6 + c)) cls += ' du-intent';
    const b = st.beams.find((b) => b.r === r && b.c === c);
    if (b) html = `${EL[b.el]}${badge(b.dir + b.pow, 'gold')}${badge('#' + b.n, 'l top')}`;
    if (st.walls.some(([wr, wc]) => wr === r && wc === c)) { cls += ' t-wall'; html = '🧱'; }
    const it = st.items.find((x) => x.r === r && x.c === c);
    if (it) html = it.ice ? '🧊' : `<span style="${it.used ? 'opacity:.35' : ''}">${it.k === 'mirror' ? `<b class="mirror">${it.dir === '/' ? '╱' : '╲'}</b>` : Duel.items[it.k].icon}</span>`;
    const u = st.units.find((u) => u.r === r && u.c === c);
    if (u) html = u.hp > 0 ? `<span class="${u.side === 'you' ? 'ally' : 'enemy'}">${u.side === 'you' ? '🧙' : DUEL_FOES[u.type].icon}</span>` + badge(u.hp, u.side === 'you' ? 'good' : 'bad') : '<span style="opacity:.45">💀</span>';

  heist(st, r, c, L) {

    const g = st.guards.find((g) => g.r === r && g.c === c);
    if (g) html = (g.asleep ? '💤' : g.type === 'hound' ? '🐕' : '💂') + (g.face && !g.asleep ? badge(g.face, 'bad') : '') + (g.lure ? badge('🎭', 'l top') : '');

    return { cls, html };
  },
};

    'Barrels explode (2 damage around them) and topple pillars next to them. Pillars crush the 2 tiles they fall on for 3, and can knock over the next pillar.',
    'Lightning runs through connected water and iron chains. Frost makes a tile immune to everything, and frozen water stops carrying lightning.'],
  ambush: ['Pick a trap, then tap a road tile. The totem goes on grass beside the road. Tap a placed trap to take it back.',
    'Press <b>Unleash</b> and the war party marches one tile per step in the order shown (+N on the first road tile). Wolves move 2.',
    'An enemy can’t pass another on the road, so a trapped enemy holds up everyone behind it. That is how you bunch them up for a Fire Glyph.',
    'The shaman heals everyone next to it by 1 each step. The troll breaks thorn walls at once and only stays trapped for 1 step.'],
  vanguard: ['Pick a unit, then tap a tile in the bottom 3 rows (up to 3 units). Then pick gear and tap one of your units to equip it.',
    'Press <b>Unleash</b>. Every step, each unit attacks the nearest enemy in range or walks toward it. Units at the top act first each step.',
    'Units that fall are gone for the rest of the loop. Gear is used up either way. Survivors return to your satchel.',
    'Enemies within 2 tiles of your Shieldbearer must attack it. Bombers explode for 2 on everything around them.'],
  duel: ['The numbered beams on the board are the enemy spell: element, direction and power. They fire in order, 1 then 2 then 3. Faint tiles show where each beam is aimed.',
    'Place counters in the middle rows. For a mirror, choose ╱ or ╲ first. Tap a placed counter to take it back.',
    'A beam stops at the first creature it reaches, friend or foe. Mirrors bend it 90°, the Leech sends the first beam back 1 stronger, and prisms split it left and right.',
    'Your HP carries from duel to duel, so a cheap win that costs HP can lose you the next one.'],
  heist: ['Tap tiles next to your thief to draw a route from the exit. Tap the last tile to undo a step, or press Wait to stand still for a step.',
    'Use ◀ ▶ to preview each step: where the guards walk and what they see (red). The route must pass the relic and end back at the exit within the step limit.',
    'Guards see 3 tiles straight ahead. Hounds smell the 4 tiles around them, through smoke and shadow. Walls and locked doors block sight.',
    'Smoke and the Shadow Draught trigger when your route reaches them. Darts go on a guard, keys on a door, the decoy on open floor.'],
};

// ---------------------------------------------------------------- loop shell
function makeLoop(G, root) {
  const L = { G, root, loopNo: 1, idx: 0, seen: new Set([0]), satchel: {}, persist: {}, placements: [], route: [], sel: null, dirIdx: 0,
    phase: 'setup', frames: null, fi: 0, res: null, msg: '', preview: 0, timer: null, history: [] };
  L.newLoop = () => { L.idx = 0; L.satchel = { ...G.satchel }; L.persist = G.persist ? { ...G.persist } : {}; L.history = []; startEnc(L); };
  L.newLoop();
  return L;
}
function startEnc(L) {
  const G = L.G; L.enc = G.encounters[L.idx];
  L.placements = []; L.sel = null; L.phase = 'setup'; L.frames = null; L.res = null; L.fi = 0; L.preview = 0;
  if (G.route) L.route = [Heist.exit(L.enc)];
  L.msg = `${L.enc.name}: ${L.enc.goal}`;
  computeIntent(L);
}
const avail = (L, k) => (L.satchel[k] || 0) - L.placements.filter((p) => p.k === k).length;
function computeIntent(L) {
  if (L.G !== Duel) return;
  const set = new Set(), enc = L.enc;
  for (const b of enc.beams) {
    let [r, c] = [b.r, b.c]; const [dr, dc] = ARROW[b.dir];
    for (;;) { r += dr; c += dc; if (r < 0 || r >= 7 || c < 0 || c >= 6) break; if (enc.walls.some(([wr, wc]) => wr === r && wc === c)) break; set.add(r * 6 + c); if (enc.foes.some(([, fr, fc]) => fr === r && fc === c) || (enc.you[0] === r && enc.you[1] === c)) break; }
  }
  L.intent = set;
}
function setupState(L) {
  const G = L.G;
  if (G === Heist) { const f = G.sim(L.enc, L.placements, null, L.route, false).frames; return f[Math.min(L.preview, f.length - 1)].st; }
  return G.setupState(L.enc, L.placements, L.persist);
}
function removeAt(L, r, c) {
  const i = L.placements.map((p, j) => (p.r === r && p.c === c ? j : -1)).filter((j) => j >= 0).pop();
  if (i == null) return false;
  const p = L.placements[i];
  if (L.G.items[p.k].unit) L.placements = L.placements.filter((q) => !(q.r === r && q.c === c));
  else L.placements.splice(i, 1);
  L.msg = `${L.G.items[p.k].name} returned to your satchel.`;
  return true;
}
function tap(L, r, c) {
  const G = L.G, enc = L.enc;
  if (L.phase !== 'setup') return;
  if (G === Heist && !L.sel) {
    const rt = L.route, last = rt[rt.length - 1];
    if (last[0] === r && last[1] === c && rt.length > 1) {
      rt.pop(); L.placements = L.placements.filter((p) => !((p.k === 'smoke' || p.k === 'invis') && !rt.some(([a, b], i) => i > 0 && a === p.r && b === p.c)));
      L.preview = rt.length - 1; L.msg = 'Step removed.';
    } else if (Math.abs(last[0] - r) + Math.abs(last[1] - c) === 1 && G.passable(enc, L.placements, r, c)) {
      if (rt.length - 1 >= enc.maxSteps) L.msg = `That’s all ${enc.maxSteps} steps. Dawn comes after that.`;
      else { rt.push([r, c]); L.preview = rt.length - 1; L.msg = `Step ${rt.length - 1} of ${enc.maxSteps}.`; }
    } else if (removeAt(L, r, c)) { /* removed */ } else L.msg = G.describe(enc, L.placements, r, c);
    return render(L);
  }
  if (!L.sel) { if (!removeAt(L, r, c)) L.msg = G.describe(enc, L.placements, r, c); return render(L); }
  const k = L.sel;
  if (avail(L, k) <= 0) { L.sel = null; L.msg = 'None left.'; return render(L); }
  const ok = G.canPlace(enc, L.placements, k, r, c, L.route);
  if (ok !== true) { if (!removeAt(L, r, c)) L.msg = ok; return render(L); }
  L.placements.push({ k, r, c, dir: G.items[k].dirs ? G.items[k].dirs[L.dirIdx] : undefined });
  L.msg = `${G.items[k].name} placed. Tap it to take it back.`;
  if (avail(L, k) <= 0) L.sel = null;
  render(L);
}
function unleash(L) {
  const G = L.G;
  L.res = G === Heist ? G.sim(L.enc, L.placements, null, L.route, true) : G.sim(L.enc, L.placements, L.persist);
  L.frames = L.res.frames; L.fi = 0; L.phase = 'resolving'; L.sel = null;
  play(L);
}
function play(L) {
  clearTimeout(L.timer);
  render(L);
  if (L.fi >= L.frames.length - 1) { L.timer = setTimeout(() => finish(L), 500); return; }
  L.timer = setTimeout(() => { L.fi++; play(L); }, L.G.frameMs);
}
function skip(L) { clearTimeout(L.timer); L.fi = L.frames.length - 1; finish(L); }
function finish(L) {
  if (L.phase !== 'resolving') return;
  const G = L.G, res = L.res;
  for (const p of L.placements) L.satchel[p.k]--;
  for (const [k, n] of Object.entries(res.returned || {})) L.satchel[k] += n;
  if (res.persist) L.persist = res.persist;
  L.history.push({ name: L.enc.name, win: res.win });
  if (!res.win) L.phase = 'failed';
  else if (L.idx === G.encounters.length - 1) L.phase = 'complete';
  else L.phase = 'reward';
  L.fi = L.frames.length - 1;
  render(L);
}
function replay(L) { L.phase = 'replay'; L.fi = 0; const step = () => { render(L); if (L.fi < L.frames.length - 1) { L.fi++; L.timer = setTimeout(step, L.G.frameMs); } else L.timer = setTimeout(() => { L.phase = 'failed'; render(L); }, 600); }; step(); }
function takeReward(L, k) { L.satchel[k] = (L.satchel[k] || 0) + 1; L.idx++; L.seen.add(L.idx); startEnc(L); render(L); }
function restartLoop(L) { clearTimeout(L.timer); L.loopNo++; L.newLoop(); render(L); }

function render(L) {
  const G = L.G, enc = L.enc, root = L.root;
  const st = L.phase === 'setup' ? setupState(L) : L.frames[L.fi].st;
  const track = el('div', { class: 'track' }, G.encounters.map((e, i) => {
    const state = i < L.idx ? 'done' : i === L.idx ? 'now' : '';
    return el('span', { class: 'step ' + state }, `${i + 4}. ${i < L.idx ? '✓ ' : ''}${L.seen.has(i) ? e.name : '???'}`);
  }));
  const stats = [stat('Loop', L.loopNo, 'gold')];
  if (G === Duel) stats.push(stat('Your HP', `${(L.phase === 'setup' ? L.persist.hp : st.units.find((u) => u.type === 'you').hp)}/6`, 'good'), stat(DUEL_FOES[enc.foes[0][0]].name, st.units[0].hp, 'bad'));
  if (G === Ambush) stats.push(stat('Marching order', enc.enemies.map((e) => AMBUSH_UNITS[e.type].icon).join(''), 'bad'));
  if (G === Vanguard) stats.push(stat('Deployed', `${L.placements.filter((p) => G.items[p.k].unit).length}/${G.deploy}`, 'gold'));
  if (G === Heist) stats.push(stat('Steps', `${L.route.length - 1}/${enc.maxSteps}`, 'gold'), stat('Showing step', L.phase === 'setup' ? L.preview : st.t, ''));
  if (L.phase !== 'setup') stats.push(stat('Beat', `${L.fi + 1}/${L.frames.length}`, ''));

  let top;
  if (L.phase === 'reward') top = el('div', { class: 'result win' }, el('strong', {}, 'Victory'), el('span', {}, L.res.reason + ' Pick one thing you found to keep:'),
    el('div', { class: 'actions' }, enc.reward.map((k) => btn(`${G.items[k].icon} ${G.items[k].name}`, () => takeReward(L, k), { primary: true }))));
  else if (L.phase === 'failed') top = el('div', { class: 'result lose' }, el('strong', {}, 'The loop resets to dusk'), el('span', {}, `${L.res.reason} Everything you used is gone; your satchel goes back to how it was at fight 4. You remember what you saw.`),
    el('div', { class: 'actions' }, btn('Restart loop', () => restartLoop(L), { primary: true }), btn('Watch again', () => replay(L))));
  else if (L.phase === 'complete') top = el('div', { class: 'result win' }, el('strong', {}, 'Loop broken!'), el('span', {}, `${L.res.reason} You cleared fights 4–6 on loop ${L.loopNo}. In the full game you would push on to fight 7.`),
    el('div', { class: 'actions' }, btn('Play the loop again', () => { L.loopNo = 0; L.seen = new Set([0]); restartLoop(L); }, { primary: true })));
  else top = el('p', { class: 'msg', 'aria-live': 'polite' }, L.phase === 'setup' ? L.msg : (L.frames[L.fi].log || '…'));

  const board = boardEl(G.R, G.C, (r, c) => {
    const s = RENDER[G.key](st, r, c, L);
    if (L.phase === 'setup' && L.sel && G.canPlace(enc, L.placements, L.sel, r, c, L.route) === true) s.cls += ' target';
    if (L.phase === 'setup' && G === Heist && !L.sel) { const last = L.route[L.route.length - 1]; if (Math.abs(last[0] - r) + Math.abs(last[1] - c) === 1 && G.passable(enc, L.placements, r, c)) s.cls += ' target'; }
    return s;
  }, (r, c) => tap(L, r, c));

  const setup = L.phase === 'setup';
  const items = el('div', { class: 'satchel' }, el('h3', {}, 'Satchel (everything you have left this loop)'),
    Object.keys(G.items).map((k) => {
      const n = setup ? avail(L, k) : L.satchel[k] || 0;
      if (!(L.satchel[k] > 0) && !L.placements.some((p) => p.k === k)) return null;
      return el('button', { class: 'item', 'aria-pressed': L.sel === k ? 'true' : 'false', disabled: !setup || n <= 0,
        onclick: () => { L.sel = L.sel === k ? null : k; L.msg = G.items[k].info; render(L); } },
      G.anchored.includes(k) ? el('span', { class: 'anc', title: 'Carried over from an earlier loop' }, '⚓') : null,
      el('span', { class: 'ct' }, '×' + n), el('span', { class: 'ic' }, G.items[k].icon), el('span', { class: 'nm' }, G.items[k].name));
    }));
  const extra = [];
  if (setup && L.sel && G.items[L.sel].dirs) extra.push(el('div', { class: 'actions' }, el('span', { class: 'sub' }, 'Direction:'),
    G.items[L.sel].dirs.map((d, i) => el('button', { class: 'btn' + (L.dirIdx === i ? ' primary' : ''), onclick: () => { L.dirIdx = i; render(L); } }, d === '/' ? '╱' : d === '\\' ? '╲' : d))));
  if (setup && G === Heist) extra.push(el('div', { class: 'actions' },
    btn('◀', () => { L.preview = Math.max(0, L.preview - 1); render(L); }), btn('▶', () => { L.preview = Math.min(Math.max(L.route.length - 1, 20), L.preview + 1); render(L); }),
    btn('Wait a step', () => { if (L.route.length - 1 >= enc.maxSteps) { L.msg = 'No steps left.'; } else { L.route.push(L.route[L.route.length - 1].slice()); L.preview = L.route.length - 1; L.msg = 'You wait one step.'; } render(L); }),
    btn('Clear route', () => { L.route = [L.route[0]]; L.placements = L.placements.filter((p) => p.k !== 'smoke' && p.k !== 'invis'); L.preview = 0; render(L); })));

  const actions = el('div', { class: 'actions' },
    setup ? btn('Unleash', () => unleash(L), { primary: true }) : null,
    setup && (L.placements.length || (G === Heist && L.route.length > 1)) ? btn('Clear all', () => { L.placements = []; if (G === Heist) { L.route = [L.route[0]]; L.preview = 0; } render(L); }) : null,
    L.phase === 'resolving' ? btn('Skip to the end', () => skip(L)) : null,
    setup ? btn('Restart loop', () => restartLoop(L)) : null);

  root.replaceChildren(...[
    el('h2', {}, G.title), el('p', { class: 'tagline' }, G.tagline),
    track, el('div', { class: 'stats' }, stats),
    el('div', { class: 'objective' }, el('b', {}, `Fight ${L.idx + 4} · ${enc.name}`), ' ', enc.goal),
    top, board, setup ? items : null, ...extra, actions,
    el('details', { class: 'help' }, el('summary', {}, 'How to play'), el('ul', {}, HELP[G.key].map((l) => el('li', { html: l })))),
  ].filter(Boolean));
}

// ---------------------------------------------------------------- tabs
const LOOPS = {};
for (const [k, G] of Object.entries(ONE_TURN_GAMES)) LOOPS[k] = makeLoop(G, document.getElementById('game-' + k));
function show(key) {
  if (!LOOPS[key]) key = 'spark';
  for (const k of Object.keys(LOOPS)) { document.getElementById('game-' + k).hidden = k !== key; $tab(k).setAttribute('aria-selected', String(k === key)); }
  render(LOOPS[key]);
  try { localStorage.setItem('one-turn-tab', key); } catch (e) { /* storage unavailable */ }
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.game)));
let firstTab = location.hash.slice(1);
if (!LOOPS[firstTab]) { try { firstTab = localStorage.getItem('one-turn-tab') || ''; } catch (e) { firstTab = ''; } }
show(firstTab);

</script>
