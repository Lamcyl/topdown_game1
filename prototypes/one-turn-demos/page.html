<title>One-Turn Fight Demos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  /* Layout: one phone-width column — tabs, loop track, objective, message, board, satchel, actions. Single dark candlelit look, shared with the grid demos. */
  :root {
    --bg: #15131c; --panel: #201d2a; --line: #3a3549; --fg: #ece6d6; --muted: #a59fb3;
    --gold: #e0b55c; --good: #6fcf8a; --bad: #e0627a; --rot: #9b6bd6; --cell: #2a2636; --cell-alt: #2f2a3d;
    --display: "Cinzel", "Trajan Pro", Georgia, serif; --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
  body { font: 15px/1.45 var(--body); }
  .wrap { max-width: 560px; margin: 0 auto; padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
  h1 { font: 700 20px/1.2 var(--display); letter-spacing: 0.04em; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .tab { font: 600 11px/1.2 var(--display); letter-spacing: 0.02em; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 2px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
  .game { display: flex; flex-direction: column; gap: 10px; }
  .game h2 { font: 700 17px/1.2 var(--display); margin: 0; letter-spacing: 0.03em; }
  .tagline { margin: 0; color: var(--muted); font-size: 13px; }
  .track { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { font: 600 12px var(--body); padding: 4px 9px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); }
  .step.now { border: 1px solid var(--gold); color: var(--gold); }
  .step.done { border: 1px solid var(--good); color: var(--good); }
  .objective { font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  .objective b { font-family: var(--display); letter-spacing: 0.02em; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat b { font-weight: 600; }
  .stat.good b { color: var(--good); } .stat.bad b { color: var(--bad); } .stat.gold b { color: var(--gold); }
  .msg { margin: 0; min-height: 2.9em; padding: 8px 10px; background: var(--panel); border-left: 3px solid var(--gold); border-radius: 4px; font-size: 14px; }
  .result { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .result.win { border-color: var(--good); } .result.lose { border-color: var(--bad); }
  .result strong { font: 700 16px var(--display); }
  .board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; width: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 5px; padding: 0; cursor: pointer; background: var(--cell); color: var(--fg); font-size: clamp(16px, 5.6vw, 28px); line-height: 1; display: grid; place-items: center; }
  .cell:nth-child(odd) { background: var(--cell-alt); }
  .cell:focus-visible, .tab:focus-visible, .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .cell .badge { position: absolute; right: 2px; bottom: 1px; font: 600 10px/1 var(--body); color: var(--fg); background: rgba(0,0,0,.6); border-radius: 4px; padding: 1px 3px; }
  .cell .badge.l { left: 2px; right: auto; } .cell .badge.top { top: 1px; bottom: auto; }
  .cell .badge.bad { color: #fff; background: var(--bad); } .cell .badge.good { color: #10140f; background: var(--good); } .cell .badge.gold { color: #1a1408; background: var(--gold); }
  .cell.target { box-shadow: inset 0 0 0 2px var(--gold); }
  .cell.attack { box-shadow: inset 0 0 0 3px var(--bad); }
  .cell.flash { animation: flash .5s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px #fff, 0 0 18px var(--gold); } to { box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .cell.flash { animation: none; } }
  .ally { text-shadow: 0 0 6px var(--good); } .enemy { text-shadow: 0 0 6px var(--bad); }
  .t-wall { background: #0d0c12 !important; } .t-water { background: #1d3f63 !important; }
  .sp-hay { background: #5e5226 !important; } .sp-oil { background: #3b2a12 !important; } .sp-ash { background: #2a2424 !important; }
  .sp-frozen { box-shadow: inset 0 0 0 2px #9fd8f0; } .sp-fire { background: #a2401c !important; }
  .am-road { background: #4a3c28 !important; } .am-grass { background: #263826 !important; }
  .road-arrow { font-size: 55%; opacity: .5; }
  .vg-home { background: #23302a !important; } .vg-foe { background: #33222a !important; }
  .du-zone { background: #2b2a3f !important; } .du-intent { box-shadow: inset 0 0 0 1px rgba(224,98,122,.55); }
  .du-fire { background: #a2401c !important; } .du-frost { background: #4f8fb0 !important; } .du-lightning { background: #b49a2a !important; } .du-arcane { background: #7a4fb0 !important; }
  .mirror { font-size: 120%; color: #cde6ff; }
  .he-route { background: #3a3324 !important; } .he-seen { box-shadow: inset 0 0 0 999px rgba(224,98,122,.28); } .he-smoke { box-shadow: inset 0 0 0 999px rgba(200,200,210,.45); }
  .satchel { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .satchel h3 { grid-column: 1 / -1; margin: 2px 0 0; font: 600 12px var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); cursor: pointer; font-size: 11px; min-width: 0; }
  .item .ic { font-size: 22px; line-height: 1.1; } .item .nm { text-align: center; overflow-wrap: anywhere; }
  .item .ct { position: absolute; top: 3px; right: 5px; font: 600 11px var(--body); color: var(--gold); } .item .anc { position: absolute; top: 3px; left: 5px; font-size: 11px; }
  .item[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); background: #2c2636; }
  .item:disabled { opacity: .4; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { font: 600 14px var(--body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); }
  .btn:disabled { opacity: .45; cursor: default; }
  details.help { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details.help summary { cursor: pointer; font-weight: 600; }
  details.help ul { margin: 8px 0 4px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 65ch; }
</style>

<div class="wrap">
  <header>
    <h1>One-Turn Fight Demos</h1>
    <p class="sub">Each game is a loop of fights 4–6. Set up, press Unleash, and watch it play out with no further input. Win and you keep one thing you found. Lose and the loop resets to fight 4 with your original satchel. Items are used up; ⚓ items were carried over from an earlier loop.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Demos">
    <button class="tab" role="tab" id="tab-spark" data-game="spark">Spark</button>
    <button class="tab" role="tab" id="tab-ambush" data-game="ambush">Ambush</button>
    <button class="tab" role="tab" id="tab-vanguard" data-game="vanguard">Vanguard</button>
    <button class="tab" role="tab" id="tab-duel" data-game="duel">Mirror Duel</button>
    <button class="tab" role="tab" id="tab-heist" data-game="heist">Heist</button>
  </nav>
  <section class="game" id="game-spark" role="tabpanel" aria-labelledby="tab-spark"></section>
  <section class="game" id="game-ambush" role="tabpanel" aria-labelledby="tab-ambush" hidden></section>
  <section class="game" id="game-vanguard" role="tabpanel" aria-labelledby="tab-vanguard" hidden></section>
  <section class="game" id="game-duel" role="tabpanel" aria-labelledby="tab-duel" hidden></section>
  <section class="game" id="game-heist" role="tabpanel" aria-labelledby="tab-heist" hidden></section>
</div>
