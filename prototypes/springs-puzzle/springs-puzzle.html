<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  /* One screen, no page scroll: run controls on top, the level fills the middle, the piece bar at the bottom.
     Inspect, goals and help open as sheets over the map. Placeholder art only. */
  :root {
    --bg: #15131c; --panel: #201d2a; --line: #3a3549; --fg: #ece6d6; --muted: #a59fb3;
    --gold: #e0b55c; --good: #6fcf8a; --bad: #e0627a;
    --display: "Cinzel", "Trajan Pro", Georgia, serif; --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font: 14px/1.4 var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100vh; height: 100dvh; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px;
    padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  h2 { font: 700 16px/1.2 var(--display); margin: 0; letter-spacing: 0.03em; }
  h3 { font: 600 12px/1.2 var(--body); margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 4px 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .bar1 { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
  .gold { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .hp { position: relative; height: 18px; border-radius: 9px; background: #3a2230; overflow: hidden; min-width: 60px; }
  .hp > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #c94a5e, #e0806a); }
  .hp > span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 18px; font-weight: 600; }
  .chip { display: inline-flex; gap: 3px; align-items: center; padding: 1px 7px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 20px; }
  .raw { width: 9px; height: 11px; clip-path: polygon(50% 0, 100% 40%, 75% 100%, 25% 100%, 0 40%); display: inline-block; }
  .forged { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px currentColor; border: 1.5px solid rgba(0,0,0,.6); }
  .mapbox { position: relative; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; background: #0c0a10; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .toast { position: absolute; left: 8px; right: 8px; top: 6px; text-align: center; pointer-events: none; }
  .toast span, .hint span { display: inline-block; background: rgba(20,17,28,.9); border: 1px solid var(--line); padding: 3px 10px; border-radius: 8px; font-size: 12px; }
  .hint { position: absolute; left: 8px; right: 8px; top: 6px; text-align: center; pointer-events: none; }
  .sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; max-height: 62%; overflow: auto; background: rgba(28,25,38,.97); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.5); user-select: text; -webkit-user-select: text; }
  .sheet.full { top: 6px; max-height: none; }
  .sheet .title { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .btn { font: 600 13px var(--body); color: var(--fg); background: #2b2738; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 34px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: #4b3a17; border-color: var(--gold); color: #ffe7b0; }
  .btn.small { padding: 3px 8px; min-height: 30px; font-size: 12px; }
  .btn.on { border-color: var(--gold); color: var(--gold); }
  .tools { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  .tool { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; height: 46px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: #241f30; color: var(--fg); cursor: pointer; font: 600 10px var(--body); }
  .tool .ic { font-size: 19px; line-height: 22px; }
  .tool .cost { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tool.on { border-color: var(--gold); background: #3a2f18; }
  .tool.locked { opacity: .45; }
  .tool .lock { position: absolute; top: 1px; right: 3px; font-size: 10px; }
  .list { display: flex; flex-direction: column; gap: 5px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: #29253a; }
  .item .info { font-size: 12px; color: var(--muted); }
  select { font: 13px var(--body); background: #2b2738; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; min-height: 32px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .goldc { color: var(--gold); } .muted { color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.perm { color: var(--gold); border-color: #6b5527; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 12px; font-size: 12px; }
  @media (max-width: 400px) { .tools { grid-template-columns: repeat(5, 1fr); } .tool { height: 40px; } .tool .ic { font-size: 17px; line-height: 19px; } }
  @media (min-height: 760px) and (min-width: 401px) { .tool { height: 52px; } .tool .ic { font-size: 22px; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Orbforge puzzle demo: the level, pieces and flow rules (no DOM), shared by the page and the Node checks.
/* eslint-disable no-unused-vars */
const BEAT = 0.25;   // seconds per beat; belts move an orb one tile per beat (4 orbs/s per lane at most)
const WINDOW = 32;   // rates are measured over the last 32 beats (8 s)
const SPRING_EVERY = 4; // a wellspring emits one orb every 4 beats (1 orb/s)
const HOLD = 16;     // permanent objectives must stay satisfied this many beats (4 s) in a row
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
const ARROWS = ['↑', '→', '↓', '←'];

const ORBS = {
  fire: { name: 'Fire', tier: 1 }, water: { name: 'Water', tier: 1 }, earth: { name: 'Earth', tier: 1 }, air: { name: 'Air', tier: 1 },
  steam: { name: 'Steam', tier: 2 }, magma: { name: 'Magma', tier: 2 }, mud: { name: 'Mud', tier: 2 },
  lightning: { name: 'Lightning', tier: 2 }, ice: { name: 'Ice', tier: 2 }, dust: { name: 'Dust', tier: 2 },
};
const RECIPES = { 'fire+water': 'steam', 'earth+fire': 'magma', 'earth+water': 'mud', 'air+fire': 'lightning', 'air+water': 'ice', 'air+earth': 'dust' };
const recipeKey = (a, b) => [a, b].sort().join('+');
const PARTS = Object.fromEntries(Object.entries(RECIPES).map(([k, v]) => [v, k.split('+')])); // steam → ['fire', 'water']

// Pieces. Belts are unlimited; everything else is counted in the inventory.
const PIECES = {
  belt: { name: 'Belt', icon: '➜', unlimited: true, info: 'Moves orbs one tile per beat. Takes from behind or the sides. Drag to lay a line.' },
  splitter: { name: 'Splitter', icon: '⑂', info: 'Takes from behind; sends orbs left and right in turn, so each side gets half.' },
  joiner: { name: 'Joiner', icon: '⑃', info: 'Takes from behind and both sides, alternating between them, and sends forward. Makes sequences.' },
  mixer: { name: 'Mixer', icon: '⚗️', info: 'Takes one orb from each of two inputs and sends one merged orb out of the gold notch (fire + water → steam). A third input jams it.' },
  demerger: { name: 'Demerger', icon: '⚖', info: 'Takes a merged orb from behind and splits it: first part out the left, second out the right (steam → fire left, water right).' },
  underpass: { name: 'Underpass', icon: '🕳️', pair: true, info: 'A tunnel: tap the entrance, then the exit 2–4 tiles straight ahead. Orbs go under whatever is between (belts, pieces, goals) but never under trees, the river, doors or gates.' },
  wellspring: { name: 'Wellspring', icon: '⛲', info: 'Goes on a spring spot by the start. Emits 1 orb a second of the element you chose for this run.' },
};
const PIECE_ORDER = ['belt', 'splitter', 'joiner', 'mixer', 'demerger', 'underpass', 'wellspring'];
const UNDERPASS_MIN = 2, UNDERPASS_MAX = 4; // exit distance from the entrance, in tiles

// ---------------------------------------------------------------- the level
// Tiles: '#' trees, '.' meadow, 'S' spring spot, '~' river, 'B' barrier (owned by an objective).
// The valley is open meadow; woods divide it into small clearings, and clumps of trees stand inside them.
const W = 27, H = 34, START = [13, 29];
function carve() {
  const g = Array.from({ length: H }, () => Array(W).fill('#'));
  const clear = (x0, y0, x1, y1, ch = '.') => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) g[y][x] = ch; };
  const trees = (...xy) => { for (const [x, y] of xy) g[y][x] = '#'; };
  clear(9, 26, 17, 32);               // A: Spring Meadow (start)
  for (const x of [11, 13, 15]) g[32][x] = 'S';
  trees([16, 27], [17, 27], [17, 28], [9, 29], [9, 30]);
  clear(9, 18, 17, 24);               // B: Ember Glade
  trees([10, 21], [10, 22], [11, 22], [16, 23], [17, 23], [17, 22]);
  clear(18, 20, 18, 21); clear(19, 18, 24, 23); // H: shrine clearing, open from B
  trees([19, 18], [20, 18], [20, 23], [21, 23]);
  clear(9, 11, 17, 16);               // C: Mill Pond
  trees([16, 15], [17, 15], [17, 16], [9, 16], [10, 16]);
  clear(18, 12, 18, 14);              // open track C → G
  clear(1, 11, 7, 16);                // D: Forge Yard
  trees([6, 11], [7, 11], [5, 16], [6, 16], [7, 16]);
  clear(1, 8, 7, 9);                  // the hollow below the oaks
  trees([1, 8], [6, 9], [7, 9]);
  clear(3, 7, 3, 7);                  // E: the one gap between the great oaks
  clear(1, 1, 6, 6);                  // E: the Oak Narrows
  trees([6, 2], [6, 4], [6, 5], [6, 6], [1, 5], [1, 6], [5, 6]);
  clear(8, 1, 16, 6);                 // F: Standing Stones
  trees([10, 4], [11, 4], [14, 3], [15, 5], [9, 6]);
  clear(19, 11, 25, 16); clear(21, 11, 22, 16, '~'); // G: the River
  trees([19, 16], [20, 16], [24, 16], [25, 16], [23, 15]);
  clear(23, 10, 25, 10);              // track from the far bank to the castle
  clear(18, 1, 25, 9);                // I: Castle Green
  trees([20, 8], [21, 8], [18, 9], [19, 9], [21, 1], [22, 1]);
  return g;
}
// Objectives. kind: door (rate, opens forever) · held (rate, open only while fed) · bridge (total, built forever)
// · rune (alternating sequence at a rate, opens forever) · scales (two equal rates, opens forever) · shrine (rate, reward only)
const OBJECTIVES = [
  { id: 'A', name: 'The Village Gate', kind: 'door', receptors: [{ x: 9, y: 26, el: 'fire', rate: 1 }], barrier: [[12, 25], [13, 25], [14, 25]],
    reward: { splitter: 1 }, hint: 'Belt your fire wellspring into the brazier at 1 orb a second.' },
  { id: 'B', name: 'Twin Braziers', kind: 'door', receptors: [{ x: 9, y: 18, el: 'fire', rate: 0.5 }, { x: 17, y: 18, el: 'fire', rate: 0.5 }], barrier: [[12, 17], [13, 17], [14, 17]],
    reward: { water: true, wellspring: 1 }, hint: 'Each brazier needs half a fire a second. One stream, two braziers…' },
  { id: 'H', name: 'Shrine of Embers', kind: 'shrine', optional: true, receptors: [{ x: 24, y: 18, el: 'fire', rate: 1.5 }],
    reward: { splitter: 1 }, hint: 'More fire than one wellspring can give.' },
  { id: 'C', name: 'The Mill Sluice', kind: 'held', receptors: [{ x: 17, y: 11, el: 'water', rate: 0.5 }], barrier: [[8, 12], [8, 13], [8, 14]],
    reward: { mixer: 1 }, hint: 'The mill wheel lifts the portcullis only while water keeps turning it. Everything west passes under it.' },
  { id: 'D', name: 'The Forge Door', kind: 'door', receptors: [{ x: 1, y: 16, el: 'steam', rate: 0.5 }], barrier: [[2, 10], [3, 10], [4, 10]],
    reward: { demerger: 1, underpass: 1 }, hint: 'The forge wants steam: fire and water mixed. Keep the sluice turning too.' },
  { id: 'E', name: 'The Oak Narrows', kind: 'door', receptors: [{ x: 1, y: 1, el: 'water', rate: 0.5 }, { x: 6, y: 3, el: 'fire', rate: 0.5 }], barrier: [[7, 1]],
    reward: { joiner: 1 }, hint: 'One lane fits between the oaks. Beyond them fire and water come out on the wrong sides: one must pass under the other.' },
  { id: 'F', name: 'The Standing Stones', kind: 'rune', pattern: ['fire', 'water'], receptors: [{ x: 16, y: 1, els: ['fire', 'water'], rate: 1 }],
    reward: { earth: true, wellspring: 1, mixer: 1 }, hint: 'Fire, water, fire, water… one a second, never two the same in a row.' },
  { id: 'G', name: 'The River', kind: 'bridge', receptors: [{ x: 19, y: 11, el: 'earth', total: 30 }], barrier: [],
    reward: { splitter: 1 }, hint: 'Pour 30 earth into the bridge-works to span the river.' },
  { id: 'I', name: 'The Castle Scales', kind: 'scales', receptors: [{ x: 18, y: 1, el: 'magma', rate: 0.5 }, { x: 25, y: 1, el: 'mud', rate: 0.5 }], barrier: [],
    reward: { end: true }, hint: 'Magma and mud, half a second each, perfectly balanced.' },
];
const OBJ = Object.fromEntries(OBJECTIVES.map((o) => [o.id, o]));
const GRID = carve();
const idx = (x, y) => y * W + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const BARRIER = new Map();  // tile → objective id
const RECEPTOR = new Map(); // tile → [objective id, receptor index]
for (const o of OBJECTIVES) {
  o.barrier = o.barrier || [];
  for (const [x, y] of o.barrier) { GRID[y][x] = 'B'; BARRIER.set(idx(x, y), o.id); }
  o.receptors.forEach((r, i) => { RECEPTOR.set(idx(r.x, r.y), [o.id, i]); if (!r.els) r.els = [r.el]; });
}
const RIVER = []; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (GRID[y][x] === "~") RIVER.push([x, y]);
OBJ.G.barrier = RIVER; // the bridge turns the river into crossable planks

// ---------------------------------------------------------------- state
function newState() {
  return {
    unlocked: ['fire'], inv: { splitter: 0, joiner: 0, mixer: 0, demerger: 0, underpass: 0, wellspring: 1 },
    pieces: {},       // tile index → piece
    done: {},         // objective id → true once completed (reward given; permanent ones stay open)
    seen: {},         // tile index → true once seen
    runs: 0, run: null, // run: { beat, orbs: Map, rec, gates } while flowing
  };
}
const pieceAt = (st, x, y) => st.pieces[idx(x, y)];
function gateOpen(st, id) { return st.run ? !!st.run.gates[id] : false; }
// Can orbs (and the player) pass this tile?
function passable(st, x, y) {
  if (!inMap(x, y)) return false;
  const t = GRID[y][x];
  if (t === '.' || t === 'S') return true;
  if (t === '~') return !!st.done.G;
  if (t === 'B') { const o = OBJ[BARRIER.get(idx(x, y))]; return o.kind === 'held' ? gateOpen(st, o.id) : !!st.done[o.id]; }
  return false;
}
// Tiles you can reach (and build on): flood from the start. Held-gate tiles are buildable when next to a reachable tile.
function reachable(st) {
  const r = new Uint8Array(W * H), q = [START];
  r[idx(...START)] = 1;
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inMap(nx, ny) || r[idx(nx, ny)]) continue;
      if (passable(st, nx, ny)) { r[idx(nx, ny)] = 1; q.push([nx, ny]); }
      else if (GRID[ny][nx] === 'B' && OBJ[BARRIER.get(idx(nx, ny))].kind === 'held') r[idx(nx, ny)] = 2; // gate tile: build only
    }
  }
  for (let i = 0; i < W * H; i++) if (r[i]) markSeen(st, i);
  return r;
}
function markSeen(st, i) { // a reachable tile reveals its 8 neighbours too (walls, receptors)
  const x = i % W, y = (i - x) / W;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inMap(x + dx, y + dy)) st.seen[idx(x + dx, y + dy)] = 1;
}

// ---------------------------------------------------------------- building
function canPlace(st, type, x, y) {
  if (!inMap(x, y)) return 'Off the map.';
  const i = idx(x, y), reach = reachable(st)[i];
  if (!reach) return GRID[y][x] === '#' ? 'Trees grow here.' : 'You can’t reach there yet.';
  if (RECEPTOR.has(i)) return 'That’s an objective.';
  if (st.pieces[i]) return 'Something is already here.';
  if (type === 'wellspring') {
    if (GRID[y][x] !== 'S') return 'Wellsprings only go on the spring spots in the Spring Grounds.';
    if (st.run) return 'End the run to place wellsprings.';
  } else if (GRID[y][x] === 'S') return 'Spring spots are for wellsprings.';
  if (!PIECES[type].unlimited && !(st.inv[type] > 0)) return `No ${PIECES[type].name}s left.`;
  return null;
}
// An underpass is placed as a pair: entrance and exit in a straight line, 2–4 tiles apart.
function canUnderpass(st, x1, y1, x2, y2) {
  const why = canPlace(st, 'underpass', x1, y1) || canPlace(st, 'underpass', x2, y2);
  if (why) return why;
  const dx = Math.sign(x2 - x1), dy = Math.sign(y2 - y1), dist = Math.abs(x2 - x1) + Math.abs(y2 - y1);
  if (dx && dy) return 'The exit must be straight ahead of the entrance.';
  if (dist < UNDERPASS_MIN || dist > UNDERPASS_MAX) return `The exit must be ${UNDERPASS_MIN}–${UNDERPASS_MAX} tiles from the entrance.`;
  for (let k = 1; k < dist; k++) {
    const x = x1 + dx * k, y = y1 + dy * k, t = GRID[y][x];
    if (t === '#' || t === '~' || t === 'B') return 'Tunnels can’t pass under trees, the river, doors or gates.';
  }
  return null;
}
function placeUnderpass(st, x1, y1, x2, y2) {
  const why = canUnderpass(st, x1, y1, x2, y2);
  if (why) return why;
  const dir = x2 > x1 ? 1 : x2 < x1 ? 3 : y2 > y1 ? 2 : 0, dist = Math.abs(x2 - x1) + Math.abs(y2 - y1);
  st.inv.underpass--;
  st.pieces[idx(x1, y1)] = { type: 'underpass', end: 'in', x: x1, y: y1, dir, link: idx(x2, y2), dist, tunnel: [] };
  st.pieces[idx(x2, y2)] = { type: 'underpass', end: 'out', x: x2, y: y2, dir, link: idx(x1, y1), dist };
  return null;
}
function place(st, type, x, y, dir = 0, el = null) {
  if (PIECES[type].pair) return 'Underpasses are placed as a pair: entrance, then exit.';
  const why = canPlace(st, type, x, y);
  if (why) return why;
  if (!PIECES[type].unlimited) st.inv[type]--;
  const p = { type, x, y, dir };
  if (type === 'wellspring') { p.el = el && st.unlocked.includes(el) ? el : st.unlocked[0]; p.timer = 0; }
  if (type === 'splitter') p.flip = 0;
  if (type === 'joiner') p.last = -1;
  if (type === 'mixer') p.slots = {};
  if (type === 'demerger') p.out = null;
  st.pieces[idx(x, y)] = p;
  return null;
}
function remove(st, x, y) {
  const i = idx(x, y), p = st.pieces[i];
  if (!p) return 'Nothing here.';
  if (p.type === 'wellspring' && st.run) return 'End the run to move wellsprings.';
  if (!PIECES[p.type].unlimited) st.inv[p.type]++;
  delete st.pieces[i];
  if (st.run) st.run.orbs.delete(i);
  if (p.type === 'underpass') { delete st.pieces[p.link]; if (st.run) st.run.orbs.delete(p.link); } // both ends go together
  return null;
}
function rotate(st, x, y, dir) {
  const p = pieceAt(st, x, y);
  if (!p) return 'Nothing here.';
  if (p.type === 'wellspring' && st.run) return 'Wellsprings are fixed during a run.';
  if (p.type === 'underpass') return 'A tunnel runs from its entrance to its exit; pick it up to re-lay it.';
  p.dir = dir; return null;
}
function attune(st, x, y, el) {
  const p = pieceAt(st, x, y);
  if (!p || p.type !== 'wellspring') return 'Not a wellspring.';
  if (st.run) return 'A wellspring’s element can only change between runs.';
  if (!st.unlocked.includes(el)) return 'You haven’t unlocked that element.';
  p.el = el; return null;
}

// ---------------------------------------------------------------- runs
function startRun(st) {
  if (st.run) return 'Already running.';
  st.runs++;
  st.run = { beat: 0, orbs: new Map(), nextId: 1, gates: {}, rec: {}, held: {} };
  for (const o of OBJECTIVES) st.run.rec[o.id] = o.receptors.map(() => ({ hist: new Array(WINDOW).fill(0), count: 0, cur: 0, total: 0, seq: [] }));
  for (const p of Object.values(st.pieces)) { p.timer = 0; if (p.type === 'mixer') p.slots = {}; if (p.type === 'demerger') p.out = null; if (p.type === 'splitter') p.flip = 0; if (p.type === 'joiner') p.last = -1; if (p.type === 'underpass') p.tunnel = []; }
  return null;
}
function endRun(st) { st.run = null; return null; } // orbs vanish, held gates drop, layout stays

// ---------------------------------------------------------------- flow (one beat)
const stepFrom = (x, y, d) => [x + DIRS[d][0], y + DIRS[d][1]];

    card.append(el('p', {}, p.end === 'in' ? `Entrance: orbs go under ${p.dist - 1} tile${p.dist > 2 ? 's' : ''} and come up at the exit.` : 'Exit: orbs come up here and carry on forward.'),
      el('div', { class: 'row' }, btn('Pick up both ends', act(() => { const why = remove(st, x, y); if (!why) closeSheet(); return why; }), { small: true })));
    return card;
  }
  const fixed = p.type === 'wellspring' && st.run;
  card.append(el('h3', {}, 'Facing'), el('div', { class: 'row' }, ...ARROWS.map((a, d) => btn(a, act(() => rotate(st, x, y, d)), { small: true, on: p.dir === d, disabled: fixed })),
    btn('Pick up', act(() => { const why = remove(st, x, y); if (!why) closeSheet(); return why; }), { small: true, disabled: fixed })));
  return card;
}
function helpSheet() {
  return el('div', {}, head('How to play'),
    el('p', {}, 'Wellsprings by the start pour out orbs, one a second. Belt them through the level into braziers, basins and locks. Each goal asks for an element at a rate; hold it and a door opens, a bridge forms, or a gate rises.'),
    el('h3', {}, 'Runs'),
    el('p', { class: 'sub' }, 'A run is one session of flow. Between runs you place wellsprings on the spring spots and choose each one’s element; during a run they are fixed. You can build and rewire freely during a run. Ending a run clears the orbs and drops held gates; your layout and everything opened for good stay.'),
    el('h3', {}, 'Pieces'), el('div', { class: 'list', style: 'font-size:12px' }, ...PIECE_ORDER.map((k) => el('div', {}, `${PIECES[k].icon} `, el('b', {}, PIECES[k].name), PIECES[k].unlimited ? ' (unlimited)' : '', ` — ${PIECES[k].info}`))),
    el('p', { class: 'sub' }, 'Belts are unlimited; every other piece is counted. Goals give more. Pick a piece up to reuse it — a door that stays open doesn’t need its pieces any more.'),
    el('h3', {}, 'Goals'), el('div', { class: 'list', style: 'font-size:12px' }, ...Object.entries(KIND_TEXT).map(([, t]) => el('div', {}, t))),
    el('h3', {}, 'Rates'), el('p', { class: 'sub' }, 'A belt lane carries up to 4 orbs a second. Rates are measured over the last 8 seconds, so give a new line a moment. A splitter halves a stream; a mixer turns one of each input into one merged orb; a demerger does the reverse.'),
    el('h3', {}, 'Controls'), el('p', { class: 'sub' }, 'Tap to place the selected piece (tapping the same piece re-aims it). Drag pans; with Belt it lays a line, with Pick up it wipes. Pinch or scroll to zoom. 🎯 lists the goals you’ve found.'),
    el('div', { class: 'row', style: 'margin-top:10px' }, btn('Reset the level', () => { if (confirm('Forget all progress in this level?')) { st = newState(); reach = reachable(st); persist(); sheet = 'goals'; renderAll(); } }, { small: true })));
}

// ---------------------------------------------------------------- loop
function renderAll() { renderBars(); renderTools(); renderSheet(true); }
let last = performance.now(), uiClock = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (st.run) {
    acc += real;
    const per = BEAT / speed;
    while (acc >= per) {
      acc -= per;
      for (const ev of step(st)) {
        if (ev.type === 'done') {
          const o = OBJ[ev.id];
          say(`✨ ${o.name}${o.kind === 'held' ? ' rises' : o.kind === 'bridge' ? ' is bridged' : ' opens'}! You gained: ${ev.reward.join(', ')}.${ev.reward.some((r) => / element/.test(r)) || ev.reward.some((r) => /Wellspring/.test(r)) ? ' End the run to use it.' : ''}`, 6000);
          persist(); reach = reachable(st); renderTools();
          if (o.reward.end) { sheet = 'goals'; renderSheet(true); }
        }
        if (ev.type === 'gate') { reach = reachable(st); if (!ev.open) say(`⛓ ${OBJ[ev.id].name} dropped — it needs steady flow.`); }
        if (ev.type === 'fizzle') say('💨 Those two don’t mix. The Mixer fizzled them.');
      }
    }
    uiClock += real;
    if (uiClock > 0.3) { uiClock = 0; renderBars(); renderSheet(false); }
  }
  const shown = toastMsg && now < toastUntil ? toastMsg : '';
  if (shown !== toast.dataset.msg) { toast.dataset.msg = shown; toast.replaceChildren(...(shown ? [el('span', {}, shown)] : [])); hint.style.visibility = shown ? 'hidden' : ''; }
  draw(now);
  requestAnimationFrame(frame);
}
// First visit: put the starting wellspring on the middle spring spot, facing up.
if (!Object.keys(st.pieces).length && !st.runs) { place(st, 'wellspring', 13, 32, 0, 'fire'); reach = reachable(st); say('Lay belts from your fire wellspring to the brazier, then ▶ Start run. 🎯 shows goals.', 9000); }
new ResizeObserver(() => resize()).observe(canvas);
resize(); renderAll();
requestAnimationFrame(frame);

</script>
</body>
</html>
