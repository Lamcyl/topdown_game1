<!doctype html>
<html lang="en">
<head>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  /* One screen, no page scroll: status bars on top, the map fills the middle, the build bar at the bottom.
     Inspect, Keep and between-run panels open as sheets over the map. Placeholder art only. */
  :root {
    --bg: #15131c; --panel: #201d2a; --line: #3a3549; --fg: #ece6d6; --muted: #a59fb3;
    --gold: #e0b55c; --good: #6fcf8a; --bad: #e0627a;
    --display: "Cinzel", "Trajan Pro", Georgia, serif; --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font: 14px/1.4 var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100vh; height: 100dvh; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px;
    padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  h2 { font: 700 16px/1.2 var(--display); margin: 0; letter-spacing: 0.03em; }
  h3 { font: 600 12px/1.2 var(--body); margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 4px 0; }
  .sub { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .bar1 { display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
  .gold { color: var(--gold); font-weight: 700; white-space: nowrap; }
  .hp { position: relative; height: 18px; border-radius: 9px; background: #3a2230; overflow: hidden; min-width: 60px; }
  .hp > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #c94a5e, #e0806a); }
  .hp > span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 18px; font-weight: 600; }
  .chip { display: inline-flex; gap: 3px; align-items: center; padding: 1px 7px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 20px; }
  .raw { width: 9px; height: 11px; clip-path: polygon(50% 0, 100% 40%, 75% 100%, 25% 100%, 0 40%); display: inline-block; }
  .forged { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px currentColor; border: 1.5px solid rgba(0,0,0,.6); }
  .mapbox { position: relative; flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; background: #0c0a10; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .toast { position: absolute; left: 8px; right: 8px; top: 8px; text-align: center; pointer-events: none; }
  .toast span, .hint span { display: inline-block; background: rgba(20,17,28,.9); border: 1px solid var(--line); padding: 3px 10px; border-radius: 8px; font-size: 12px; }
  .hint { position: absolute; left: 8px; right: 8px; bottom: 6px; text-align: center; pointer-events: none; }
  .sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; max-height: 62%; overflow: auto; background: rgba(28,25,38,.97); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.5); user-select: text; -webkit-user-select: text; }
  .sheet.full { top: 6px; max-height: none; }
  .sheet .title { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .btn { font: 600 13px var(--body); color: var(--fg); background: #2b2738; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 34px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: #4b3a17; border-color: var(--gold); color: #ffe7b0; }
  .btn.small { padding: 3px 8px; min-height: 30px; font-size: 12px; }
  .btn.on { border-color: var(--gold); color: var(--gold); }
  .tools { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
  .tool { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; height: 46px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: #241f30; color: var(--fg); cursor: pointer; font: 600 10px var(--body); }
  .tool .ic { font-size: 19px; line-height: 22px; }
  .tool .cost { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tool.on { border-color: var(--gold); background: #3a2f18; }
  .tool.locked { opacity: .45; }
  .tool .lock { position: absolute; top: 1px; right: 3px; font-size: 10px; }
  .list { display: flex; flex-direction: column; gap: 5px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: #29253a; }
  .item .info { font-size: 12px; color: var(--muted); }
  select { font: 13px var(--body); background: #2b2738; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; min-height: 32px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .goldc { color: var(--gold); } .muted { color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.perm { color: var(--gold); border-color: #6b5527; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 12px; font-size: 12px; }
  @media (min-height: 760px) { .tool { height: 52px; } .tool .ic { font-size: 22px; } }
</style>

<script>
// Crossroads demo: the map, real-time run rules (belts, towers, mobs) and between-run progress (no DOM), shared by the page and the Node checks.
/* eslint-disable no-unused-vars */
const MAP_N = 41, MAP_C = 20; // 41×41 tiles, the Keep's centre tile at (20, 20)

const FRONTS = ['N', 'E', 'S', 'W'];

// tier 1 primaries, 2 secondaries, 3 tertiaries; parts = the primaries an orb is made of (decides which fronts it counters)
const ORBS = {
  fire: { name: 'Fire', icon: '🔥', tier: 1 }, water: { name: 'Water', icon: '💧', tier: 1 },
  earth: { name: 'Earth', icon: '🪨', tier: 1 }, air: { name: 'Air', icon: '🌪️', tier: 1 },
  steam: { name: 'Steam', icon: '☁️', tier: 2 }, magma: { name: 'Magma', icon: '🌋', tier: 2 }, mud: { name: 'Mud', icon: '🟫', tier: 2 },
  lightning: { name: 'Lightning', icon: '⚡', tier: 2 }, ice: { name: 'Ice', icon: '❄️', tier: 2 }, dust: { name: 'Dust', icon: '🌫️', tier: 2 },
  eruption: { name: 'Eruption', icon: '🌠', tier: 3 }, obsidian: { name: 'Obsidian', icon: '🖤', tier: 3 },
  quagmire: { name: 'Quagmire', icon: '🫧', tier: 3 }, storm: { name: 'Storm', icon: '⛈️', tier: 3 },
};
const RECIPES = {
  'fire+water': 'steam', 'earth+fire': 'magma', 'earth+water': 'mud',
  'air+fire': 'lightning', 'air+water': 'ice', 'air+earth': 'dust',
  'magma+steam': 'eruption', 'magma+mud': 'obsidian', 'mud+steam': 'quagmire', 'ice+lightning': 'storm',
};
const recipeKey = (a, b) => [a, b].sort().join('+');
function orbParts(el) {
  if (ORBS[el].tier === 1) return [el];
  const key = Object.keys(RECIPES).find((k) => RECIPES[k] === el);
  return [...new Set(key.split('+').flatMap(orbParts))];
}

const TUNING = {

  keepLight: 4.5, beaconLight: 3.5, beaconCost: 20, beaconStep: 10,
  extractorCost: 15, mineRate: 1.5,

  mergeStep: 10, lairHp: 60, lairBounty: 25,
  beat: 0.25, // belts move orbs one tile per beat
  magazine: 6, dormant: 3,
  nightfall: 300, // waves grow by 100% every this many seconds
  stirEvery: 150, // every 150 s the dark stirs a sleeping lair, lit or not
  keepGun: { range: 3.5, cd: 1, dmg: 1 }, // the Keep's own weak bolt, needs no orbs
};

// Element effects (real time): dmg per hit; burn [per second, seconds]; soak/slow/freeze in seconds.
const EFFECTS = {
  fire: { dmg: 2, burn: [1, 3], fiery: true, info: 'Burns: 1 a second for 3 s.' },
  water: { dmg: 1, soak: 4, info: 'Soaks: puts out fire shields; lightning does double.' },

  mud: { dmg: 2, crack: true, soak: 4, slow: [0.5, 3], info: 'Cracks armour, soaks, and slows to half speed.' },
  lightning: { dmg: 4, zap: true, info: 'Double damage against a soaked foe.' },
  ice: { dmg: 3, freeze: 1.2, brittle: true, info: 'Freezes for 1.2 s; the next hit does double.' },
  dust: { dmg: 2, crack: true, unshield: true, info: 'Sandblasts away armour and fire shields.' },
  eruption: { dmg: 10, splash: 1.5, burn: [2, 3], fiery: true, info: 'Bursts over an area and sets it burning.' },
  obsidian: { dmg: 14, crack: true, info: 'A huge hit that cracks armour.' },
  quagmire: { dmg: 3, splash: 1.5, soak: 4, slow: [0.5, 3], info: 'Bursts over an area, soaking and slowing.' },
  storm: { dmg: 9, zap: true, brittle: true, info: 'Double damage against a soaked foe, and leaves it brittle.' },
};

// Foes by region. hp grows with nightfall.
const MOBS = {
  N: { name: 'Armoured brute', hp: 12, speed: 0.8, armour: 2, dmg: 8, gold: 4, every: 4 },
  E: { name: 'Shielded imp', hp: 9, speed: 1.0, shield: true, dmg: 6, gold: 4, every: 4 },
  S: { name: 'Marsh swarmer', hp: 4, speed: 1.5, dmg: 2, gold: 1, every: 1.6 },
  W: { name: 'Sky raider', hp: 8, speed: 1.2, flies: true, dmg: 6, gold: 4, every: 4 },
};

// Buildings. solid = blocks the road (and gets attacked); flat ones can be walked over.
const BUILD = {
  beacon: { name: 'Beacon', icon: '🕯️', solid: true, hp: 25, info: 'Lights the fog around it. Must go inside your light.' },
  extractor: { name: 'Extractor', icon: '⛏️', cost: 15, solid: true, hp: 25, info: 'Goes on a vein; sends raw orbs to the Keep.' },
  belt: { name: 'Belt', icon: '➜', cost: 2, dir: true, info: 'Moves forged orbs one tile per beat. Drag to lay a line.' },
  splitter: { name: 'Splitter', icon: '⑂', cost: 6, dir: true, info: 'Takes orbs from behind, sends them out left and right in turn.' },
  joiner: { name: 'Joiner', icon: '⑃', cost: 6, dir: true, info: 'Takes from the back and both sides, alternating, and sends forward. Makes sequences.' },
  mixer: { name: 'Mixer', icon: '⚗️', cost: 12, dir: true, solid: true, hp: 30, info: 'Two forged inputs in, one secondary out the front. Same + same makes a stronger orb. More than two inputs jams it.' },

  mortar: { name: 'Mortar', icon: '☄️', cost: 40, tower: true, solid: true, hp: 40, range: 5.5, min: 1.5, cd: 1.8, mult: 1.3, radius: 1.3, blueprint: 'n-blue', info: 'Slow lob that splashes an area. Can’t hit up close.' },
  lance: { name: 'Lance', icon: '🔱', cost: 35, tower: true, solid: true, hp: 40, range: 4.5, cd: 1.2, mult: 1.2, blueprint: 'w-blue', info: 'A bolt that pierces every foe on its way.' },
  spray: { name: 'Spray Fountain', icon: '⛲', cost: 30, tower: true, solid: true, hp: 40, range: 2.5, cd: 0.7, mult: 0.7, cone: 0.6, info: 'Short cone that hits everything in front.' },
  trap: { name: 'Rune Trap', icon: '✴️', cost: 15, tower: true, flat: true, hp: 40, range: 0.7, cd: 0.8, mult: 2, radius: 1, roadOnly: true, info: 'Goes on the road. Bursts when walked over (fliers pass above).' },
  source: { name: 'Source', icon: '🔮', dir: true, solid: true, hp: 30, info: 'Makes forged orbs forever, out of its front.' },
};
const TOWERS = Object.keys(BUILD).filter((k) => BUILD[k].tower);
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up, right, down, left
const ARROWS = ['↑', '→', '↓', '←'];

// ---------------------------------------------------------------- the handmade map
// dx, dy are offsets from the Keep (north = negative dy). gate: id of the gate that must be opened first.
const FEATURES = [
  // North: Stonereach (earth, armoured foes)
  { id: 'n-vein1', type: 'vein', el: 'earth', amount: 80, dx: -2, dy: -5 },
  { id: 'n-vein2', type: 'vein', el: 'earth', amount: 60, dx: 3, dy: -6 },
  { id: 'n-lore', type: 'lore', dx: 1, dy: -4, text: 'Carved in the stone: “The Stone Gate drinks only fire.”' },
  { id: 'n-lair1', type: 'lair', name: 'Gravel Den', p: 1, dx: 0, dy: -10, via: [[-3, -7]] },
  { id: 'n-vein3', type: 'vein', el: 'earth', amount: 150, dx: -5, dy: -11 },
  { id: 'n-gate', type: 'gate', name: 'Stone Gate', need: 'fire', n: 40, dx: 5, dy: -11 },
  { id: 'n-vein4', type: 'vein', el: 'earth', amount: 250, dx: 7, dy: -13, gate: 'n-gate' },
  { id: 'n-way', type: 'waystone', dx: -2, dy: -13 },
  { id: 'n-blue', type: 'blueprint', tower: 'mortar', name: 'Mortar blueprint', dx: -8, dy: -14 },
  { id: 'n-buried', type: 'vein', el: 'earth', amount: 120, buried: true, dx: -9, dy: -9 },
  { id: 'n-lair2', type: 'lair', name: 'Iron Barrow', p: 2, dx: 2, dy: -17, via: [[5, -15], [2, -12]] },
  { id: 'n-recipe', type: 'recipe', orb: 'obsidian', dx: -5, dy: -18 },
  { id: 'n-seal', type: 'seal', name: 'Seal of Stone', dx: 7, dy: -18 },
  // East: Ember Wastes (fire, fire-shielded foes)
  { id: 'e-vein1', type: 'vein', el: 'fire', amount: 80, dx: 5, dy: 1 },
  { id: 'e-vein2', type: 'vein', el: 'fire', amount: 60, dx: 6, dy: -2 },
  { id: 'e-lore', type: 'lore', dx: 4, dy: 2, text: 'Scratched on a charred post: “Water quenches the Wastes. The Ember Gate thirsts.”' },
  { id: 'e-lair1', type: 'lair', name: 'Cinder Hollow', p: 1, dx: 10, dy: 0, via: [[8, 3]] },
  { id: 'e-vein3', type: 'vein', el: 'fire', amount: 150, dx: 11, dy: 5 },
  { id: 'e-gate', type: 'gate', name: 'Ember Gate', need: 'water', n: 40, dx: 12, dy: -4 },
  { id: 'e-vein4', type: 'vein', el: 'fire', amount: 250, dx: 14, dy: -6, gate: 'e-gate' },
  { id: 'e-way', type: 'waystone', dx: 9, dy: 6 },
  { id: 'e-blue', type: 'blueprint', tower: 'beam', name: 'Beam Spire blueprint', dx: 14, dy: 8 },
  { id: 'e-buried', type: 'vein', el: 'fire', amount: 120, buried: true, dx: 9, dy: -7 },
  { id: 'e-lair2', type: 'lair', name: 'Ashen Maw', p: 2, dx: 17, dy: 1, via: [[15, -2]] },
  { id: 'e-recipe', type: 'recipe', orb: 'eruption', dx: 18, dy: -5 },
  { id: 'e-seal', type: 'seal', name: 'Seal of Embers', dx: 18, dy: 6 },
  // South: Tidemarsh (water, swarms) — the gentlest direction
  { id: 's-vein1', type: 'vein', el: 'water', amount: 80, dx: -1, dy: 5 },
  { id: 's-vein2', type: 'vein', el: 'water', amount: 60, dx: 2, dy: 6 },
  { id: 's-lore', type: 'lore', dx: -2, dy: 4, text: 'A half-sunk marker: “Earth holds back the Sluice. A rod finds what the marsh hides.”' },
  { id: 's-lair1', type: 'lair', name: 'Reed Nest', p: 1, dx: 0, dy: 10, via: [[3, 8]] },
  { id: 's-vein3', type: 'vein', el: 'water', amount: 150, dx: 5, dy: 11 },
  { id: 's-gate', type: 'gate', name: 'Tide Sluice', need: 'earth', n: 40, dx: -5, dy: 11 },
  { id: 's-vein4', type: 'vein', el: 'water', amount: 250, dx: -7, dy: 13, gate: 's-gate' },
  { id: 's-way', type: 'waystone', dx: 2, dy: 13 },
  { id: 's-ancient', type: 'ancient', orb: 'steam', dx: 6, dy: 15 },
  { id: 's-rod', type: 'relic', key: 'rod', name: 'Dowsing Rod', info: 'Reveals buried veins on every run.', dx: -3, dy: 15 },
  { id: 's-buried', type: 'vein', el: 'water', amount: 120, buried: true, dx: -7, dy: 8 },
  { id: 's-lair2', type: 'lair', name: 'Mire Hive', p: 2, dx: -1, dy: 17, via: [[-3, 13]] },
  { id: 's-recipe', type: 'recipe', orb: 'quagmire', dx: -8, dy: 18 },
  { id: 's-seal', type: 'seal', name: 'Seal of Tides', dx: 5, dy: 19 },
  // West: Skyspire (air, fliers) — behind the Sky Gate, which needs all three seals
  { id: 'w-lore', type: 'lore', dx: -3, dy: 1, text: 'Wind sings through the gate: “Three seals, from stone, ember and tide, open the sky.”' },
  { id: 'w-gate', type: 'skygate', name: 'Sky Gate', dx: -5, dy: 0 },
  { id: 'w-vein1', type: 'vein', el: 'air', amount: 120, dx: -9, dy: 2 },
  { id: 'w-lair1', type: 'lair', name: 'Gale Roost', p: 2, dx: -11, dy: -2, via: [[-8, -5]] },
  { id: 'w-lantern', type: 'relic', key: 'lantern', name: 'Storm Lantern', info: 'Beacons light 1 tile further, every run.', dx: -12, dy: 6 },
  { id: 'w-vein2', type: 'vein', el: 'air', amount: 200, dx: -14, dy: -4 },
  { id: 'w-blue', type: 'blueprint', tower: 'lance', name: 'Lance blueprint', dx: -15, dy: 9 },
  { id: 'w-recipe', type: 'recipe', orb: 'storm', dx: -16, dy: -9 },
  { id: 'w-lair2', type: 'lair', name: 'Storm Eyrie', p: 4, final: true, dx: -18, dy: 0, via: [[-15, 3]] },
];
for (const f of FEATURES) { f.x = MAP_C + f.dx; f.y = MAP_C + f.dy; }
const FEATURE_BY_ID = Object.fromEntries(FEATURES.map((f) => [f.id, f]));
const PERMANENT = new Set(['blueprint', 'recipe', 'relic', 'seal', 'waystone']);

const idx = (x, y) => y * MAP_N + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < MAP_N && y < MAP_N;
function noise(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function regionOf(x, y) {
  const dx = x - MAP_C, dy = y - MAP_C;
  if (Math.max(Math.abs(dx), Math.abs(dy)) <= 1) return 'K';
  if (Math.abs(dy) >= Math.abs(dx)) return dy < 0 ? 'N' : 'S';
  return dx > 0 ? 'E' : 'W';
}
function ringOf(x, y) { const d = Math.max(Math.abs(x - MAP_C), Math.abs(y - MAP_C)); return d <= 1 ? 0 : d <= 7 ? 1 : d <= 13 ? 2 : 3; }
const isKeep = (x, y) => regionOf(x, y) === 'K';
// Beyond the Sky Gate the west is veiled: no light gets in until the gate opens.
const isVeiled = (x, y) => regionOf(x, y) === 'W' && x < MAP_C - 5;

const featureAt = new Map(FEATURES.map((f) => [idx(f.x, f.y), f]));

// Roads: each lair's path to the Keep, bending through its handmade waypoints (via) and preferring roads already laid so they join up.
function shortestPath(road, from, isGoal, own) {
  const dist = new Float64Array(MAP_N * MAP_N).fill(Infinity), prev = new Int32Array(MAP_N * MAP_N).fill(-1);
  const heap = [[0, idx(from[0], from[1])]];
  dist[heap[0][1]] = 0;
  while (heap.length) {
    let bi = 0; for (let i = 1; i < heap.length; i++) if (heap[i][0] < heap[bi][0]) bi = i;
    const [d, i] = heap.splice(bi, 1)[0];
    if (d > dist[i]) continue;
    const x = i % MAP_N, y = (i - x) / MAP_N;
    if (isGoal(x, y)) {
      const path = [];
      for (let k = i; k !== -1; k = prev[k]) path.push([k % MAP_N, Math.floor(k / MAP_N)]);
      return path.reverse();
    }

        if (locked) { say(`🔒 ${T.name}: find its blueprint out in ${REGIONS[regionOf(FEATURE_BY_ID[T.blueprint].x, FEATURE_BY_ID[T.blueprint].y)].name}.`); return; }
        if (k === 'source') { if (tool === 'source' || !toolEl || !(run.inv[toolEl] > 0)) pickSourceEl(); }
        tool = k; if (sheet === 'tile') closeSheet(); renderTools(); renderBars();
      },
    }, locked ? el('span', { class: 'lock' }, '🔒') : null, el('span', { class: 'ic', style: k === 'source' && toolEl ? `filter: drop-shadow(0 0 4px ${ORB_COL[toolEl]})` : null }, T.icon), el('span', { class: 'cost' }, k === 'source' ? cost : `${cost}`));
  }));
}

// ---------------------------------------------------------------- sheets
let sheetSig = '';
function renderSheet(force) {
  let node = null;
  if (screen === 'between') node = betweenSheet();
  else if (sheet === 'keep') node = keepSheet();
  else if (sheet === 'help') node = helpSheet();
  else if (sheet === 'tile' && sel) node = tileSheet();
  sheetBox.hidden = !node;
  sheetBox.classList.toggle('full', screen === 'between' || sheet === 'help');
  if (!node) { sheetSig = ''; return; }
  const sig = sheet + node.outerHTML;
  if (!force && sig === sheetSig) return;
  sheetSig = sig; const top = sheetBox.scrollTop; sheetBox.replaceChildren(node); sheetBox.scrollTop = top;
  renderBars();
}
const act = (fn) => () => { const why = fn(); if (why) say(why); persist(); renderSheet(true); renderBars(); renderTools(); };
const head = (title, sub) => el('div', { class: 'title' }, el('h2', {}, title), el('div', { class: 'row' }, sub ? el('span', { class: 'sub' }, sub) : null, btn('✕', closeSheet, { small: true })));

function tileSheet() {
  const { x, y } = sel, r = regionOf(x, y), f = featureAt.get(idx(x, y)), bd = run.b.get(idx(x, y));
  const lit = isLit(run, x, y), seen = isSeen(meta, x, y), canAct = screen === 'run' && !run.over;
  const where = `${REGIONS[r] ? REGIONS[r].name : 'Keep'} · ring ${ringOf(x, y)}`;
  if (bd) return buildingCard(bd, where, canAct);
  const card = el('div', {}, head(f ? featureName(f) : isRoad(x, y) ? 'Road' : 'Open ground', where));
  if (!lit) {
    if (isVeiled(x, y) && !run.skyOpen) card.append(el('p', { class: 'muted' }, 'Veiled by the storm. Light can’t reach here until the Sky Gate opens.'));
    else if (!seen) { card.append(el('p', { class: 'muted' }, 'Lost in the fog. Push your light out with beacons.')); return card; }
    else card.append(el('p', { class: 'muted' }, 'Remembered from an earlier run. Light it again to use it.'));
    if (!f || !seen) return card;
  }
  if (!f) {
    card.append(el('p', { class: 'sub' }, isRoad(x, y) ? 'Foes walk this road to the Keep. Solid pieces here block them (and get attacked); belts and Rune Traps can be walked over.' : 'Pick a piece in the build bar, then tap here.'));
    return card;
  }
  switch (f.type) {
    case 'vein': {
      if (f.buried && !relic(meta, 'rod')) { card.append(el('p', {}, 'Odd markings in the ground… something lies buried here. A dowsing rod would find it.')); break; }
      const left = run.veins[f.id];
      card.append(el('p', {}, `${ORBS[f.el].name} vein: ${fmt(left)} / ${f.amount} raw orbs left.`));
      if (f.gate && !run.opened.includes(f.gate)) card.append(el('p', { class: 'bad' }, `Sealed behind the ${FEATURE_BY_ID[f.gate].name}.`));
      else card.append(btn(`⛏ Build extractor · ${BUILD.extractor.cost} 🪙`, act(() => place(run, meta, 'extractor', x, y, 0, null, live())), { primary: true, disabled: !canAct || !lit }));
      break;
    }
    case 'lair': {
      const st = run.lairs[f.id], k = MOBS[regionOf(f.x, f.y)];
      card.append(el('p', {}, `Sends ${k.name}s (strength ${f.p})${f.final ? ' — the map’s final lair' : ''}.`));
      card.append(el('p', { class: st.dead ? 'good' : lairAwake(run, f) ? 'bad' : 'muted' }, st.dead ? 'Destroyed this run.' : lairAwake(run, f) ? `Awake. Health ${fmt(st.hp)}/${TUNING.lairHp * f.p}. Towers in range shell it when no foe is near.` : 'Asleep. It wakes when your light reaches it, or when the dark stirs it.'));
      card.append(el('p', { class: 'sub' }, `Counter: ${REGIONS[regionOf(f.x, f.y)].counter}.`));
      break;
    }
    case 'gate': {
      const open = run.opened.includes(f.id);
      card.append(el('p', {}, open ? 'Open for this run.' : `Feed it ${f.n} raw ${ORBS[f.need].name.toLowerCase()} orbs from the Keep.`));
      if (!open) card.append(btn(`Feed ${f.n} (have ${fmt(run.wallet[f.need] || 0)})`, act(() => feedGate(run, f)), { primary: true, disabled: !canAct || !lit || (run.wallet[f.need] || 0) < f.n }));
      break;
    }
    case 'skygate':
      card.append(el('p', {}, run.skyOpen ? 'Open: the Skyspire is lit for this run.' : `Opens with the three seals. You hold ${seals(meta)}/3.`));
      if (!run.skyOpen) card.append(btn('Open the Sky Gate', act(() => openSky(run, meta, f)), { primary: true, disabled: !canAct || !lit || seals(meta) < 3 }));
      break;
    case 'lore': card.append(el('p', {}, el('i', {}, f.text))); break;
    case 'ancient':
      card.append(el('p', {}, `An Ancient ${ORBS[f.orb].name} Source sleeps here. Claim it into your hand for this run.`));
      card.append(btn(run.claimed.includes(f.id) ? 'Claimed' : 'Claim (free)', act(() => claimAncient(run, f)), { primary: true, disabled: !canAct || !lit || run.claimed.includes(f.id) }));
      break;
    default: {
      const got = has(meta, f.id);
      const what = { blueprint: `Unlocks the ${BUILD[f.tower] ? BUILD[f.tower].name : ''} for every run.`, recipe: `Unlocks the ${ORBS[f.orb || 'storm'].name} recipe (Keep alchemy and Mixers).`, relic: f.info, seal: 'One of three seals for the Sky Gate.', waystone: 'Attune it, and later runs can start with light here.' }[f.type];
      card.append(el('p', {}, what, ' ', el('span', { class: 'tag perm' }, 'kept forever')));
      card.append(btn(got ? (f.type === 'waystone' ? 'Attuned' : 'Found') : f.type === 'waystone' ? 'Attune' : 'Take', act(() => take(run, meta, f)), { primary: !got, disabled: !canAct || !lit || got }));
    }
  }
  return card;
}
function buildingCard(bd, where, canAct) {
  const T = BUILD[bd.type], card = el('div', {}, head(bd.type === 'source' ? `${ORBS[bd.el].name} Source` : T.name, where));
  card.append(el('p', { class: 'sub' }, T.info));
  if (T.tower) {
    card.append(el('p', {}, `Range ${T.range} · every ${T.cd}s · damage ×${T.mult}${T.radius ? ` · splash ${T.radius}` : ''}`));
    card.append(el('p', {}, 'Magazine (fires left first): ', bd.mag.length ? bd.mag.map((o) => ORBS[o.el].icon + (o.power > 1 ? '⁺' : '')).join(' ') : el('span', { class: 'bad' }, 'empty — feed it from a Source or belt')));
  }
  if (bd.type === 'source') card.append(el('p', {}, `${sourceRate(bd.el)} forged orb a second, out of its front. ${EFFECTS[bd.el].info}`, bd.dormant > 0 ? el('span', { class: 'bad' }, ' Dormant (just moved).') : ''));
  if (bd.type === 'mixer') card.append(el('p', { class: mixerJammed(run, bd) ? 'bad' : '' }, mixerJammed(run, bd) ? '⚠ Jammed: more than two inputs, or something feeds its output side.' : `Holding: ${bd.slots.map((o) => ORBS[o.el].icon).join(' ') || 'nothing'}`));
  if (bd.type === 'extractor') card.append(el('p', {}, `${fmt(run.veins[bd.vein])} raw orbs left in the vein.`));
  if (bd.hp < bd.maxHp) card.append(el('p', { class: 'sub' }, `Health ${fmt(bd.hp)}/${bd.maxHp}`));
  const row = el('div', { class: 'row' });
  if (T.dir) row.append(...ARROWS.map((a, d) => btn(a, act(() => rotateAt(run, bd.x, bd.y, d)), { small: true, on: bd.dir === d, disabled: !canAct })));
  const refund = bd.type === 'source' ? 'Pick up' : `Remove (+${live() ? Math.floor(bd.paid / 2) : bd.paid} 🪙)`;
  row.append(btn(refund, act(() => { const why = removeAt(run, meta, bd.x, bd.y, live()); closeSheet(); return why; }), { small: true, disabled: !canAct }));
  card.append(row);
  if (bd.type === 'source') card.append(el('p', { class: 'sub' }, 'Picking up is free; place it again from the 🔮 tool. Moved while playing, it sleeps 3 s.'));
  else card.append(el('p', { class: 'sub' }, 'Full refund while paused, half while playing.'));
  return card;
}
function featureName(f) {
  if (f.type === 'vein') return f.buried && !relic(meta, 'rod') ? 'Odd markings' : `${ORBS[f.el].name} vein`;
  if (['lair', 'gate', 'skygate', 'blueprint', 'relic', 'seal'].includes(f.type)) return f.name;
  if (f.type === 'recipe') return `Recipe tablet: ${ORBS[f.orb].name}`;
  return { lore: 'Lore stone', waystone: 'Waystone', ancient: 'Ancient Source' }[f.type];
}

let mergeA = 'fire', mergeB = 'water';
function keepSheet() {
  const card = el('div', {}, head('🏰 The Keep', `${run.kills} foes felled`));
  const can = screen === 'run' && !run.over;
  const have = Object.keys(ORBS).filter((k) => (run.wallet[k] || 0) >= 1);
  const opts = (cur) => Object.keys(ORBS).filter((k) => have.includes(k) || k === cur).map((k) => el('option', { value: k, selected: k === cur }, `${ORBS[k].name} (${fmt(run.wallet[k] || 0)})`));
  const out = mergeResult(meta, mergeA, mergeB), s = TUNING.mergeStep;
  card.append(el('h3', {}, 'Buy a Source (it goes into your hand)'));
  if (!have.length) card.append(el('p', { class: 'sub' }, 'Bank raw orbs first: build extractors on veins.'));
  const list = el('div', { class: 'list' });
  for (const k of have) {
    const price = sourcePrice(k), ok = (run.wallet[k] || 0) >= price;
    list.append(el('div', { class: 'item' },
      el('div', {}, rawChip(k, run.wallet[k]), ` → ${ORBS[k].name} Source · ${price}`, el('div', { class: 'info' }, EFFECTS[k].info)),
      el('div', { class: 'row' }, btn('Buy', act(() => buySource(run, k)), { small: true, primary: ok, disabled: !can || !ok }),
        run.inv[k] > 0 ? btn(`Sell 1 (+${Math.floor(price / 2)})`, act(() => sellSource(run, k)), { small: true, disabled: !can }) : null)));
  }
  card.append(list);
  card.append(el('h3', {}, 'Alchemy (raw orbs, can’t be undone)'),
    el('div', { class: 'row' },
      el('select', { onchange: (e) => { mergeA = e.target.value; renderSheet(true); } }, opts(mergeA)), '+',
      el('select', { onchange: (e) => { mergeB = e.target.value; renderSheet(true); } }, opts(mergeB)),
      el('span', {}, '→ ', out ? ORBS[out].name : RECIPES[recipeKey(mergeA, mergeB)] ? '🔒 recipe not found' : '✖ no recipe'),
      btn(`Merge ${s}+${s}→${s}`, act(() => merge(run, meta, mergeA, mergeB)), { small: true, primary: !!out, disabled: !can || !out || (run.wallet[mergeA] || 0) < s || (run.wallet[mergeB] || 0) < s })));
  if (can) card.append(el('div', { class: 'row', style: 'margin-top:8px' }, btn('Abandon run', () => { if (confirm('End this run now? You still earn Echoes.')) finishRun(); }, { small: true })));
  return card;
}
function helpSheet() {
  const rows = TOOL_ORDER.filter((k) => BUILD[k]).map((k) => el('div', {}, `${BUILD[k].icon} `, el('b', {}, BUILD[k].name), ` — ${BUILD[k].info}`));
  return el('div', {}, head('How to play'),
    el('p', {}, 'Light the fog with beacons, put extractors on veins to bank raw orbs at the Keep, buy Sources there, place them, and belt their forged orbs into towers. Towers fire their orbs in the order they arrived. Lairs wake when your light reaches them, and every 2½ minutes the dark stirs one anyway.'),
    el('p', { class: 'sub' }, 'Drag pans the map (with the Belt tool, dragging lays belts). Pinch or scroll to zoom. ⏸ pauses: building while paused refunds in full.'),
    el('h3', {}, 'Pieces'), el('div', { class: 'list', style: 'font-size:12px' }, ...rows),
    el('h3', {}, 'Elements'), el('div', { class: 'list', style: 'font-size:12px' }, ...Object.keys(EFFECTS).map((k) => el('div', {}, el('i', { class: 'forged', style: `color:${ORB_COL[k]};background:${ORB_COL[k]}` }), ` ${ORBS[k].name}: ${EFFECTS[k].info}`))),
    el('h3', {}, 'Foes'), el('div', { class: 'list', style: 'font-size:12px' }, ...FRONTS.map((r) => el('div', {}, el('b', {}, `${REGIONS[r].name}: ${MOBS[r].name}s. `), `Counter: ${REGIONS[r].counter}.`))),
    el('h3', {}, 'Map'), el('div', { class: 'grid2' }, ...[['💀', 'Lair'], ['◆', 'Vein'], ['🚪', 'Gate (feed orbs)'], ['📐', 'Blueprint'], ['📖', 'Recipe tablet'], ['🪄🏮', 'Relics'], ['💠', 'Seal'], ['🗿', 'Waystone'], ['✨', 'Ancient Source'], ['🪧', 'Lore stone'], ['⁂', 'Odd markings'], ['⛩️', 'Sky Gate']].map(([i, t]) => el('span', {}, `${i} ${t}`))));
}
function betweenSheet() {
  const card = el('div', {});
  if (lastResult) {
    const p = lastResult.parts;
    card.append(el('h2', {}, `The Keep has fallen — run ${meta.runs}`),
      el('p', {}, `Survived ${clock(lastResult.t)}, felled ${lastResult.kills} foes. Echoes: `, el('b', { class: 'goldc' }, `+${lastResult.total}`)),
      el('p', { class: 'sub' }, `Explored ${p.explored} · lairs ${p.lairs} · foes ${p.foes} · secrets ${p.secrets} · survival ${p.survived}`));
    if (lastResult.found.length) card.append(el('p', {}, 'Kept forever: ', lastResult.found.map((id) => featureName(FEATURE_BY_ID[id])).join(', ')));
  } else {
    card.append(el('h2', {}, meta.runs ? 'Between runs' : 'Orbforge · The Crossroads'),
      el('p', {}, 'Four lands surround your Keep. Push your light outward, mine veins, buy Sources, and belt glowing orbs into towers to hold the roads as night deepens.'),
      el('p', { class: 'sub' }, 'When the Keep falls, the run ends. Map memory, finds and Echoes stay, so the next run can take another road. Tap ? in game for help.'));
  }
  card.append(el('h3', {}, `Echo shop · ${meta.echoes} Echoes`));
  const shop = el('div', { class: 'list' });
  for (const item of SHOP) {
    const cost = shopCost(meta, item), lvl = upg(meta, item.key);
    shop.append(el('div', { class: 'item' },
      el('div', {}, `${item.name}${item.costs.length > 1 ? ` (${lvl}/${item.costs.length})` : lvl ? ' ✓' : ''}`, el('div', { class: 'info' }, item.info)),
      btn(cost == null ? 'Max' : `${cost} ✦`, act(() => (buyUpgrade(meta, item.key) ? null : 'Not enough Echoes.')), { small: true, disabled: cost == null || meta.echoes < cost })));
  }
  card.append(shop);
  if (upg(meta, 'founding')) card.append(el('h3', {}, 'Founding Source'), el('div', { class: 'row' }, ...['fire', 'water', 'earth'].map((k) => btn(ORBS[k].name, act(() => { meta.foundingEl = k; }), { small: true, on: meta.foundingEl === k }))));
  const ways = FEATURES.filter((f) => f.type === 'waystone' && has(meta, f.id));
  if (ways.length) card.append(el('h3', {}, 'Start with light at'), el('div', { class: 'row' }, ...ways.map((f) => {
    const on = meta.startAt.includes(f.id);
    return btn(`🗿 ${REGIONS[regionOf(f.x, f.y)].name}`, act(() => { meta.startAt = on ? meta.startAt.filter((i) => i !== f.id) : [...meta.startAt, f.id]; }), { small: true, on });
  })), el('p', { class: 'sub' }, 'Careful: light far out wakes lairs early.'));
  const found = FEATURES.filter((f) => PERMANENT.has(f.type) && f.type !== 'waystone' && has(meta, f.id));
  card.append(el('h3', {}, `Finds kept forever (${found.length})`), el('p', { class: 'sub' }, found.length ? found.map(featureName).join(' · ') : 'None yet. Blueprints, recipe tablets, relics and seals hide out in the rings.'));
  card.append(el('label', { class: 'row sub', style: 'margin-top:8px' }, el('input', { type: 'checkbox', checked: meta.testAll, onchange: (e) => { meta.testAll = e.target.checked; persist(); renderTools(); } }), 'Test mode: every tower and recipe unlocked'));
  card.append(el('div', { class: 'row', style: 'margin-top:10px' }, btn(meta.runs ? `Begin run ${meta.runs + 1}` : 'Begin first run', startRun, { primary: true }),
    meta.runs ? btn('Reset all progress', () => { if (confirm('Forget every run, find and Echo?')) { meta = newMeta(); lastResult = null; persist(); run = newRun(meta); renderAll(); } }, { small: true }) : null));
  return card;
}

// ---------------------------------------------------------------- run lifecycle
function startRun() {
  run = newRun(meta); screen = 'run'; speed = 0; sheet = null; sel = null; lastResult = null; tool = 'inspect'; toolEl = null;
  say('Paused for building. Light the fog, mine veins, then ▶.');
  persist(); renderAll();
}
function finishRun() {
  speed = 0;
  const res = endRun(run, meta);
  lastResult = { ...res, t: run.t, kills: run.kills, found: run.newFound.slice() };
  screen = 'between'; sheet = null; persist(); renderAll();
}
function renderAll() { renderBars(); renderTools(); renderSheet(true); }

let last = performance.now(), uiClock = 0, saveClock = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (screen === 'run' && speed > 0 && !run.over) {
    let left = real * speed;
    while (left > 1e-6) {
      const dt = Math.min(0.05, left); left -= dt;
      for (const ev of tick(run, meta, dt)) {
        if (ev.type === 'lair') say(ev.final ? '🐉 The Storm Eyrie falls! The Crossroads are yours (end of the demo map).' : `💀 ${FEATURE_BY_ID[ev.id].name} destroyed! +${TUNING.lairBounty * FEATURE_BY_ID[ev.id].p} 🪙`);
        if (ev.type === 'stir') say(`🌙 The dark stirs: ${FEATURE_BY_ID[ev.id].name} wakes in ${REGIONS[regionOf(FEATURE_BY_ID[ev.id].x, FEATURE_BY_ID[ev.id].y)].name}.`);
        if (ev.type === 'depleted') say(`${ORBS[FEATURE_BY_ID[ev.id].el].name} vein drawn dry.`);
        if (ev.type === 'broken') say(`Foes broke your ${BUILD[ev.what].name}!`);
      }
      if (run.over) { finishRun(); break; }
    }
    uiClock += real; saveClock += real;
    if (uiClock > 0.25) { uiClock = 0; renderBars(); renderSheet(false); }
    if (saveClock > 5) { saveClock = 0; persist(); }
  }
  const shown = toastMsg && now < toastUntil ? toastMsg : '';
  if (shown !== toast.dataset.msg) { toast.dataset.msg = shown; toast.replaceChildren(...(shown ? [el('span', {}, shown)] : [])); }
  draw(now);
  requestAnimationFrame(frame);
}
new ResizeObserver(() => resize()).observe(canvas);
resize(); renderAll();
requestAnimationFrame(frame);

</script>
