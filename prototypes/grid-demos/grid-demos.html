<title>Grid Gameplay Demos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<style>
  /* Layout: one phone-width column — tabs, stats strip, message, square board, satchel, actions. Single dark "candlelit grimoire" look. */
  :root {
    --bg: #15131c;          /* night ink */
    --panel: #201d2a;       /* worn vellum in shadow */
    --line: #3a3549;
    --fg: #ece6d6;          /* parchment */
    --muted: #a59fb3;
    --gold: #e0b55c;        /* candle gold accent */
    --good: #6fcf8a;        /* your side, growth */
    --bad: #e0627a;         /* danger, damage */
    --rot: #9b6bd6;         /* corruption, hexes */
    --cell: #2a2636;
    --cell-alt: #2f2a3d;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
  body { font: 15px/1.45 var(--body); }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-block: 12px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font: 700 20px/1.2 var(--display); letter-spacing: 0.04em; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tab {
    font: 600 12px/1.2 var(--display); letter-spacing: 0.03em; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 4px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
  .game { display: flex; flex-direction: column; gap: 10px; }
  .game h2 { font: 700 17px/1.2 var(--display); margin: 0; letter-spacing: 0.03em; }
  .tagline { margin: 0; color: var(--muted); font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat b { font-weight: 600; }
  .stat.good b { color: var(--good); } .stat.bad b { color: var(--bad); } .stat.gold b { color: var(--gold); } .stat.rot b { color: var(--rot); }
  .msg { margin: 0; min-height: 2.9em; padding: 8px 10px; background: var(--panel); border-left: 3px solid var(--gold); border-radius: 4px; font-size: 14px; }
  .result { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .result.win { border-color: var(--good); } .result.lose { border-color: var(--bad); }
  .result strong { font: 700 16px var(--display); }
  .board { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 3px; width: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .cell {
    position: relative; aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 5px; padding: 0; cursor: pointer;
    background: var(--cell); color: var(--fg); font-size: clamp(16px, 5.4vw, 26px); line-height: 1;
    display: grid; place-items: center; transition: transform .12s, box-shadow .12s;
  }
  .cell:nth-child(odd) { background: var(--cell-alt); }
  .cell:focus-visible, .tab:focus-visible, .btn:focus-visible, .item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .cell .badge { position: absolute; right: 2px; bottom: 1px; font: 600 10px/1 var(--body); color: var(--fg); background: rgba(0,0,0,.55); border-radius: 4px; padding: 1px 3px; }
  .cell .badge.l { left: 2px; right: auto; }
  .cell .badge.top { top: 1px; bottom: auto; }
  .cell .badge.bad { color: #fff; background: var(--bad); }
  .cell .badge.good { color: #10140f; background: var(--good); }
  .cell .badge.gold { color: #1a1408; background: var(--gold); }
  .cell.target { box-shadow: inset 0 0 0 2px var(--gold); }
  .cell.attack { box-shadow: inset 0 0 0 2px var(--bad); }
  .cell.sel { box-shadow: inset 0 0 0 3px var(--gold); }
  .cell.flash { animation: flash .45s ease-out; }
  .cell.lit { transform: scale(1.08); box-shadow: 0 0 0 2px var(--gold), 0 0 14px var(--gold); z-index: 1; }
  @keyframes flash { from { box-shadow: 0 0 0 3px #fff, 0 0 18px var(--gold); } to { box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .cell { transition: none; } .cell.flash { animation: none; } }
  /* terrain / ownership */
  .t-wall { background: #0d0c12 !important; cursor: default; }
  .t-chasm { background: #050408 !important; box-shadow: inset 0 0 10px #000; }
  .t-water { background: #1d3f63 !important; }
  .t-ice { background: #8fc4dd !important; }
  .t-bridge { background: #6b4b2c !important; }
  .t-crack { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(0,0,0,.35) 6px 8px) !important; }
  .t-stairs { background: #4b3f1f !important; }
  .o-you { background: #2f5a3a !important; }
  .o-rot { background: #4a2d6b !important; }
  .o-stone { background: #555060 !important; }
  .o-prot { box-shadow: inset 0 0 0 2px var(--gold); }
  .plan { outline: 2px dashed var(--rot); outline-offset: -4px; }
  .hex { background: #3a2252 !important; box-shadow: inset 0 0 0 2px var(--rot); }
  .ally { text-shadow: 0 0 6px var(--good); }
  .enemy { text-shadow: 0 0 6px var(--bad); }
  .satchel { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .satchel h3 { grid-column: 1 / -1; margin: 2px 0 0; font: 600 12px var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .item {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); cursor: pointer; font-size: 11px; min-width: 0;
  }
  .item .ic { font-size: 22px; line-height: 1.1; }
  .item .nm { text-align: center; overflow-wrap: anywhere; }
  .item .ct { position: absolute; top: 3px; right: 5px; font: 600 11px var(--body); color: var(--gold); }
  .item .anc { position: absolute; top: 3px; left: 5px; font-size: 11px; }
  .item[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); background: #2c2636; }
  .item:disabled { opacity: .4; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { font: 600 14px var(--body); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); }
  .btn:disabled { opacity: .45; cursor: default; }
  details.help { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details.help summary { cursor: pointer; font-weight: 600; }
  details.help ul { margin: 8px 0 4px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 65ch; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <h1>Grid Gameplay Demos</h1>
    <p class="sub">Four mid-game fights with placeholder art. Everything in your satchel was found this run and is used up when you use it. Items marked ⚓ were carried over from an earlier loop.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Demos">
    <button class="tab" role="tab" id="tab-ritual" data-game="ritual">Ritual Circle</button>
    <button class="tab" role="tab" id="tab-glade" data-game="glade">Wildgrowth</button>
    <button class="tab" role="tab" id="tab-chess" data-game="chess">Wizard Chess</button>
    <button class="tab" role="tab" id="tab-delve" data-game="delve">Delve</button>
  </nav>
  <section class="game" id="game-ritual" role="tabpanel" aria-labelledby="tab-ritual"></section>
  <section class="game" id="game-glade" role="tabpanel" aria-labelledby="tab-glade" hidden></section>
  <section class="game" id="game-chess" role="tabpanel" aria-labelledby="tab-chess" hidden></section>
  <section class="game" id="game-delve" role="tabpanel" aria-labelledby="tab-delve" hidden></section>
</div>

<script>
// ---------------------------------------------------------------- shared helpers
const DIR4 = [[-1, 0], [1, 0], [0, -1], [0, 1]];
const DIR8 = [...DIR4, [-1, -1], [-1, 1], [1, -1], [1, 1]];
const rand = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rep = (x, n) => Array(n).fill(x);
const cheb = (a, b) => Math.max(Math.abs(a.r - b.r), Math.abs(a.c - b.c));
const wait = (ms) => new Promise((res) => setTimeout(res, ms));

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const stat = (label, value, tone = '') => el('span', { class: 'stat ' + tone }, label + ' ', el('b', {}, String(value)));
const btn = (label, onclick, opts = {}) => el('button', { class: 'btn' + (opts.primary ? ' primary' : ''), onclick, disabled: opts.disabled }, label);

function boardEl(rows, cols, cellFn, onTap) {
  const b = el('div', { class: 'board', style: `--cols:${cols}` });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const s = cellFn(r, c);
    const cell = el('button', { class: 'cell ' + (s.cls || ''), 'aria-label': s.label || `row ${r + 1}, column ${c + 1}`, onclick: () => onTap(r, c) });
    cell.innerHTML = s.html || '';
    b.append(cell);
  }
  return b;
}
function itemBtn({ icon, name, count, selected, anchored, disabled, onclick }) {
  return el('button', { class: 'item', 'aria-pressed': selected ? 'true' : 'false', disabled, onclick },
    anchored ? el('span', { class: 'anc', title: 'Carried over from an earlier loop' }, '⚓') : null,
    count != null ? el('span', { class: 'ct' }, '×' + count) : null,
    el('span', { class: 'ic' }, icon), el('span', { class: 'nm' }, name));
}
function resultCard(res, onRestart) {
  return el('div', { class: 'result ' + res.kind }, el('strong', {}, res.title), el('span', {}, res.text),
    el('div', { class: 'actions' }, btn('Play again', onRestart, { primary: true })));
}
function help(lines) {
  return el('details', { class: 'help' }, el('summary', {}, 'How to play'), el('ul', {}, lines.map((l) => el('li', { html: l }))));
}

// ================================================================ 3. RITUAL CIRCLE
const RP = {
  candle:   { name: 'Candle', icon: '🕯️', base: 2, info: 'Power 2. Every other piece in its row gets +2.' },
  ember:    { name: 'Ember', icon: '🔥', base: 4, info: 'Power 4. The 4 pieces touching it get +3.' },
  crystal:  { name: 'Crystal', icon: '💎', base: 1, charges: 2, info: 'Power 1. Doubles each of the 4 pieces touching it. Survives 2 ignitions.' },
  familiar: { name: 'Familiar', icon: '🐈‍⬛', base: 3, charges: 3, info: 'Power 3, +1 for every piece in the 8 tiles around it. Survives 3 ignitions.' },
  mirror:   { name: 'Mirror', icon: '🪞', base: 0, info: 'Becomes a copy of the piece on its left, including what that piece does.' },
  blood:    { name: 'Blood Sigil', icon: '🩸', base: 0, info: 'Doubles the whole total. Costs you 3 HP when you ignite.' },
  salt:     { name: 'Salt Ward', icon: '🧂', base: 0, info: 'Blocks 6 of the demon’s damage this round.' },
};
const Ritual = {
  key: 'ritual',
  reset() {
    const grid = Array.from({ length: 5 }, () => Array.from({ length: 5 }, () => ({ p: null, hex: false })));
    grid[2][2].p = { t: 'familiar', charges: 3, anchored: true };
    const bag = shuffle([...rep('candle', 6), ...rep('ember', 4), ...rep('crystal', 4), ...rep('mirror', 3), ...rep('blood', 2), ...rep('salt', 2), 'familiar']);
    this.s = { grid, bag, hand: [], sel: null, hp: 24, maxHp: 24, demon: 170, demonMax: 170, intents: [4, 6, 8, 10], round: 0, maxRounds: 4,
      busy: false, result: null, lit: null, running: null,
      msg: 'The Hollow Bishop waits at the edge of the circle. Place pieces, watch the power add up, then Ignite. Your anchored Familiar is already in the centre.' };
    this.draw(6); this.hexTiles();
  },
  draw(n) { const s = this.s; while (n-- > 0 && s.bag.length && s.hand.length < 8) s.hand.push(s.bag.pop()); },
  hexTiles() {
    const s = this.s; for (const row of s.grid) for (const x of row) x.hex = false;
    const cells = shuffle([...Array(25).keys()]).slice(0, 3);
    for (const i of cells) s.grid[Math.floor(i / 5)][i % 5].hex = true;
  },
  score() {
    const g = this.s.grid, eff = g.map((row) => row.map(() => null));
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const x = g[r][c]; if (!x.p || x.hex) continue;
      eff[r][c] = x.p.t === 'mirror' ? (c > 0 ? eff[r][c - 1] : null) : x.p.t;
    }
    const at = (r, c) => (r >= 0 && r < 5 && c >= 0 && c < 5 ? eff[r][c] : null);
    const val = g.map((row) => row.map(() => 0));
    let sum = 0, blood = 0, salt = 0;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      const t = eff[r][c]; if (!t) continue;
      if (t === 'blood') { blood++; continue; }
      if (t === 'salt') { salt++; continue; }
      let v = RP[t].base;
      for (let c2 = 0; c2 < 5; c2++) if (c2 !== c && eff[r][c2] === 'candle') v += 2;
      for (const [dr, dc] of DIR4) if (at(r + dr, c + dc) === 'ember') v += 3;
      if (t === 'familiar') for (const [dr, dc] of DIR8) if (at(r + dr, c + dc)) v += 1;
      let mult = 1; for (const [dr, dc] of DIR4) if (at(r + dr, c + dc) === 'crystal') mult *= 2;
      v *= mult; val[r][c] = v; sum += v;
    }
    return { eff, val, sum, blood, salt, total: sum * 2 ** blood };
  },
  tap(r, c) {
    const s = this.s; if (s.busy || s.result) return;
    const x = s.grid[r][c];
    if (x.p && x.p.fresh) { s.hand.push(x.p.t); x.p = null; s.msg = 'Piece returned to your hand.'; return this.render(); }
    if (s.sel == null) { s.msg = x.p ? RP[x.p.t].info : 'Pick a piece from your hand first, then tap an empty tile.'; return this.render(); }
    if (x.p) { s.msg = 'That tile is taken. Tap one of your newly placed pieces to take it back.'; return this.render(); }
    const t = s.hand.splice(s.sel, 1)[0];
    x.p = { t, fresh: true, charges: RP[t].charges };
    s.sel = null; s.msg = x.hex ? `${RP[t].name} placed on a hexed tile. It does nothing while the hex lasts.` : `${RP[t].name} placed.`;
    this.render();
  },
  async ignite() {
    const s = this.s; if (s.busy || s.result) return;
    const sc = this.score();
    if (sc.blood * 3 >= s.hp) { s.msg = `The Blood Sigils would cost ${sc.blood * 3} HP and kill you. Take one back first.`; return this.render(); }
    s.busy = true; s.sel = null; s.running = 0;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
      if (!sc.val[r][c]) continue;
      s.lit = [r, c]; s.running += sc.val[r][c]; s.msg = `Power ${s.running}`; this.render(); await wait(170);
    }
    s.lit = null;
    if (sc.blood) { s.running = sc.total; s.msg = `Blood Sigils ×${2 ** sc.blood}: power ${sc.total}!`; this.render(); await wait(450); }
    s.hp -= sc.blood * 3;
    s.demon = Math.max(0, s.demon - sc.total);
    let log = `The ritual hits for ${sc.total}.`;
    if (s.demon <= 0) { s.busy = false; s.result = { kind: 'win', title: 'The Hollow Bishop is banished', text: `Won with ${s.maxRounds - s.round - 1} ignitions left and ${s.hp} HP. Unused pieces stay in your bag for the next fight.` }; s.running = null; return this.render(); }
    const dmg = Math.max(0, s.intents[s.round] - 6 * sc.salt);
    s.hp -= dmg; log += ` The demon strikes back for ${dmg}${sc.salt ? ' (salt blocked some)' : ''}.`;
    for (const row of s.grid) for (const x of row) {
      if (!x.p) continue;
      x.p.fresh = false;
      if (x.p.charges && x.p.t !== 'mirror') { x.p.charges--; if (x.p.charges <= 0) x.p = null; } else x.p = null;
    }
    s.round++; s.running = null; s.busy = false;
    if (s.hp <= 0) s.result = { kind: 'lose', title: 'You were consumed', text: 'The demon’s blows wore you down. In the campaign the loop would reset here.' };
    else if (s.round >= s.maxRounds) s.result = { kind: 'lose', title: 'The hourglass ran out', text: `The Bishop survived with ${s.demon} HP. The loop resets to dusk.` };
    else { this.hexTiles(); this.draw(4); log += ' New hexes appear. You draw 4 pieces.'; }
    s.msg = log; this.render();
  },
  render() {
    const s = this.s, root = this.root, sc = this.score();
    const intent = s.round < s.maxRounds ? s.intents[s.round] : 0;
    const blocked = Math.min(intent, sc.salt * 6);
    const b = boardEl(5, 5, (r, c) => {
      const x = s.grid[r][c], v = sc.val[r][c];
      let html = x.p ? RP[x.p.t].icon : '';
      if (x.p && x.p.t === 'mirror' && sc.eff[r][c]) html = '🪞' + `<span class="badge l top">${RP[sc.eff[r][c]].icon}</span>`;
      if (x.p && v) html += `<span class="badge gold">${v}</span>`;
      if (x.p && x.p.charges && RP[x.p.t].charges) html += `<span class="badge l">${x.p.charges}⟳</span>`;
      if (x.p && x.p.anchored) html += `<span class="badge l top">⚓</span>`;
      let cls = x.hex ? 'hex' : '';
      if (s.lit && s.lit[0] === r && s.lit[1] === c) cls += ' lit';
      else if (s.sel != null && !x.p) cls += ' target';
      return { cls, html, label: x.p ? RP[x.p.t].name : (x.hex ? 'hexed tile' : 'empty tile') };
    }, (r, c) => this.tap(r, c));
    const hand = el('div', { class: 'satchel' }, el('h3', {}, `Hand (${s.hand.length}) · bag ${s.bag.length} left`),
      s.hand.map((t, i) => itemBtn({ icon: RP[t].icon, name: RP[t].name, selected: s.sel === i, disabled: s.busy || !!s.result,
        onclick: () => { s.sel = s.sel === i ? null : i; s.msg = RP[t].info; this.render(); } })));
    root.replaceChildren(
      el('h2', {}, 'Ritual Circle'),
      el('p', { class: 'tagline' }, 'Fight 5 of 8 · Lay ritual pieces, then ignite them. Each piece powers its neighbours, and the total hits the demon.'),
      el('div', { class: 'stats' },
        stat('Bishop', `${s.demon}/${s.demonMax}`, 'bad'), stat('You', `${s.hp}/${s.maxHp} HP`, 'good'),
        stat('Ignitions left', s.maxRounds - s.round, 'gold'),
        stat('Power now', s.running != null ? s.running : (sc.blood ? `${sc.sum}×${2 ** sc.blood}=${sc.total}` : sc.total), 'gold'),
        stat('Next hit', blocked ? `${intent}−${blocked}` : intent, 'bad')),
      s.result ? resultCard(s.result, () => { this.reset(); this.render(); }) : el('p', { class: 'msg', 'aria-live': 'polite' }, s.msg),
      b, el('div', { class: 'legend' }, el('span', {}, '🟪 hexed: pieces there do nothing'), el('span', {}, 'gold number: what the piece adds'), el('span', {}, '⟳ ignitions it survives')),
      hand,
      el('div', { class: 'actions' }, btn('Ignite', () => this.ignite(), { primary: true, disabled: s.busy || !!s.result }),
        btn('Restart fight', () => { this.reset(); this.render(); }, { disabled: s.busy })),
      help([
        'Tap a piece in your hand, then an empty tile. Tap a piece you placed this round to take it back.',
        'The numbers update as you place, so you can try layouts before you ignite.',
        '<b>Ignite</b> scores every piece, damages the demon, then most pieces burn away. Crystals and Familiars survive a few ignitions.',
        'The demon hits back after each ignition and hexes 3 new tiles. Hexed pieces score nothing.',
        'Your bag holds only what you found this run, so every piece you burn is gone for good.',
        'Combos to try: Candles sharing a row, a Crystal between two Embers, a Mirror to the right of a Blood Sigil.',
      ]));
  },
};

// ================================================================ 4. WILDGROWTH
const GI = {
  tend:    { name: 'Tend', icon: '🌱', info: 'Free once per turn. Claim one neutral tile next to your land.' },
  bramble: { name: 'Bramble Seed', icon: '🌿', info: 'Plant on or next to your land. Grows 2 tiles in each straight direction, over neutral and rot.' },
  moon:    { name: 'Moonflower', icon: '🌸', info: 'Plant on your land. Claims all 8 tiles around it.' },
  stone:   { name: 'Standing Stone', icon: '🪨', info: 'Raise on any empty tile. It blocks rot and counts as a wall when you enclose.' },
  ember:   { name: 'Wildfire Ember', icon: '🔥', info: 'Burns a 3×3 area to ash, your land too. Wisps caught in it are destroyed.' },
  lantern: { name: 'Spirit Lantern', icon: '🏮', info: 'Your tiles in a 3×3 area can’t be taken for 3 turns.' },
  snare:   { name: 'Root Snare', icon: '🪢', info: 'Pins one wisp in place for 2 turns.', anchored: true },
};
const GLADE_MAP = [
  '...#RRRR',
  '....RwHR',
  '.#...RRw',
  'Y..w..R.',
  'YY...#..',

  render() {
    const s = this.s, root = this.root, p = s.player;
    const plans = new Map(); let incoming = 0;
    if (!s.result) for (const m of s.mons) { const pl = this.plan(m); plans.set(m, pl); if (pl.kind === 'attack') incoming += DM[m.type].dmg; }
    const b = boardEl(9, 7, (r, c) => {
      const t = this.T(r, c), m = this.mon(r, c), k = r * 7 + c;
      let cls = 't-' + t.t, html = '';
      if (t.t === 'stairs') html = '⏷';
      if (this.hasChest(r, c)) html = '🧰';
      if (s.meat && s.meat.r === r && s.meat.c === c) html = '🍖' + `<span class="badge l">${s.meat.turns}</span>`;
      if (m) {
        const pl = plans.get(m);
        const tag = !pl ? '' : pl.kind === 'rest' ? '💤' : pl.kind === 'move' ? (pl.r < r ? '↑' : pl.r > r ? '↓' : pl.c < c ? '←' : '→') : pl.kind === 'attack' ? '⚔' : pl.kind === 'smash' ? '💥' : '';
        html = `<span class="enemy">${DM[m.type].icon}</span><span class="badge bad">${m.hp}</span>` + (tag ? `<span class="badge l top">${tag}</span>` : '');
      }
      if (p.r === r && p.c === c) { html = '<span class="ally">🧝</span>'; if (incoming) cls += ' attack', html += `<span class="badge bad top">−${incoming}</span>`; }
      if (s.sel && !s.result && this.validItem(s.sel, r, c)) cls += ' target';
      else if (!s.sel && !s.result && Math.abs(r - p.r) + Math.abs(c - p.c) === 1 && (this.walk(r, c) || m || this.hasChest(r, c) || t.t === 'chasm')) cls += m ? ' attack' : ' target';
      if (s.jump === k) cls += ' sel';
      if (s.flash.has(k)) cls += ' flash';
      return { cls, html, label: m ? DM[m.type].name : t.t };
    }, (r, c) => this.tap(r, c));
    const sat = el('div', { class: 'satchel' }, el('h3', {}, 'Satchel'),
      Object.entries(s.items).map(([k, n]) => itemBtn({ icon: DI[k].icon, name: DI[k].name, count: n, anchored: DI[k].anchored, selected: s.sel === k,
        disabled: !n || !!s.result, onclick: () => { s.sel = s.sel === k ? null : k; s.msg = DI[k].info; this.render(); } })));
    root.replaceChildren(
      el('h2', {}, 'Delve'),
      el('p', { class: 'tagline' }, 'Floor 4 of 6 · Every step costs sand. Find a way past the Ogre, or make your own.'),
      el('div', { class: 'stats' }, stat('HP', `${Math.max(0, s.hp)}/${s.maxHp}`, 'good'), stat('Sand', s.sand, 'gold'), stat('Incoming', incoming, incoming ? 'bad' : '')),
      s.result ? resultCard(s.result, () => { this.reset(); this.render(); }) : el('p', { class: 'msg', 'aria-live': 'polite' }, s.msg),
      b, el('div', { class: 'legend' }, el('span', {}, '↑→ monster’s next step'), el('span', {}, '⚔ attacks you next'), el('span', {}, '💤 resting'), el('span', {}, '⬛ chasm · 🟦 water · striped: cracked floor')),
      sat,
      el('div', { class: 'actions' }, btn('Restart floor', () => { this.reset(); this.render(); })),
      help([
        'Tap a tile next to you to move, attack a monster (1 damage) or open a chest. Each costs 1 sand, then every monster acts.',
        'Pick an item, then tap a gold-outlined tile to use it. Items are found in chests and are gone once used.',
        'Slow monsters (Slime, Ogre) act every other turn. Bats fly over water and chasms and flutter randomly.',
        'The Ogre never leaves the top rows and hits everything around it, monsters included. Lure Meat can make it smash its friends.',
        'Slimes split in two when they die. Cracked floor turns into a chasm when bombed.',
        'Jumping into a chasm drops you to the next floor for 2 HP, a costly shortcut.',
      ]));
  },
};

// ---------------------------------------------------------------- tabs
const GAMES = { ritual: Ritual, glade: Glade, chess: Chess, delve: Delve };
for (const g of Object.values(GAMES)) { g.root = document.getElementById('game-' + g.key); g.reset(); }
function show(key) {
  if (!GAMES[key]) key = 'ritual';
  for (const k of Object.keys(GAMES)) {
    document.getElementById('game-' + k).hidden = k !== key;
    document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === key));
  }
  GAMES[key].render();
  try { localStorage.setItem('grid-demo-tab', key); } catch (e) { /* storage unavailable */ }
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.game)));
let first = location.hash.slice(1);
if (!GAMES[first]) { try { first = localStorage.getItem('grid-demo-tab') || ''; } catch (e) { first = ''; } }
show(first);
</script>
