; Android export for sideloading. Builds from the prebuilt template (no Gradle), arm64 only.
; Signing keys are not stored here: set GODOT_ANDROID_KEYSTORE_RELEASE_PATH, _USER and _PASSWORD,
; or fill them in under Project > Export.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/benchmark-godot.apk"

[preset.0.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.example.benchgodot"
package/name="Benchmark (Godot)"
package/signed=true
screen/immersive_mode=true
